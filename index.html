<style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#edf4e9;background:#111b16}*{box-sizing:border-box}body{margin:0}header{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:10px 14px;background:#1c2b21;border-bottom:1px solid #39503d;flex-wrap:wrap}h1{font-size:18px;margin:0}small,.muted{color:#a8bea9}button,select{background:#314d37;color:white;border:1px solid #608467;border-radius:9px;padding:9px 12px;font:inherit;cursor:pointer}button:hover{background:#41694a}button.active{background:#7e6333;border-color:#c69b4e}main{display:grid;grid-template-columns:minmax(0,1fr) 330px;min-height:calc(100dvh - 65px)}#viewport{position:relative;min-height:440px;overflow:hidden;background:#243a29;touch-action:none}canvas{width:100%;height:100%;display:block;image-rendering:pixelated;touch-action:none}#hint{position:absolute;bottom:12px;left:12px;background:#15241cbb;padding:7px 10px;border-radius:8px;font-size:12px;pointer-events:none}aside{background:#1a2820;border-left:1px solid #38523d;max-height:calc(100dvh - 65px);overflow:auto;padding:14px}.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}.tabs button{padding:7px 10px;font-size:13px}h2{font-size:17px;margin:8px 0 12px}h3{font-size:14px;margin:16px 0 6px;color:#b5d8b6}.panel{background:#23362a;border:1px solid #3c5b44;border-radius:12px;padding:12px;margin-bottom:10px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.stat{background:#263e2e;border-radius:8px;padding:10px}.stat strong{display:block;font-size:20px;margin-top:3px}.bar{height:7px;background:#102016;border-radius:5px;overflow:hidden;margin:5px 0 9px}.bar span{display:block;height:100%;background:#9dcf7e}.row{display:flex;justify-content:space-between;gap:8px;align-items:center}.event{padding:8px 0;border-bottom:1px solid #354a39;font-size:13px}.event:last-child{border:0}.pill{background:#395a41;border-radius:50px;padding:3px 7px;font-size:11px}.buttons{display:flex;gap:7px;flex-wrap:wrap}.notice{font-size:12px;line-height:1.5;color:#b9cdb9}.hidden{display:none!important}@media(max-width:850px){main{display:block}#viewport{height:55dvh;min-height:300px}aside{border-left:0;border-top:1px solid #38523d;max-height:none}header{padding:9px}h1{font-size:16px}#hint{font-size:10px}}#updateNotice{display:none;position:fixed;z-index:1000;right:14px;bottom:14px;width:min(360px,calc(100vw - 28px));padding:15px;background:#263d2e;border:2px solid #9bbd79;border-radius:14px;box-shadow:0 12px 30px #0008}#updateNotice strong{display:block;margin-bottom:7px}#updateNotice p{font-size:13px;line-height:1.4}#updateNotice .buttons{display:flex;gap:8px}#updateNotice button{flex:1}#updateStatus{font-size:12px;color:#a8bea9} .popbar{height:9px;background:#344b3b;border-radius:4px;overflow:hidden}.popbar span{display:block;height:100%;background:#91c978} .milestone{border-left:3px solid #c6a56e;padding:8px;margin:8px 0;background:#2a392e} </style></head>

<script>
(()=>{'use strict';
const surnames=['Ashwood','Riverbend','Oakheart','Stonefield','Willowmere','Northbrook','Fernholm','Brightwater','Thornhill','Meadowcroft','Redleaf','Ironwood'];
const fullName=p=>p.name+' '+(p.surname||surnames[p.id%12]);
const boyNames=['Theo','Felix','Elias','Milo','Hugo','Anton','Leo','August','Emil','Arthur','Finn','Otto'];
const girlNames=['Alma','Luna','Ella','Nora','Clara','Liv','Iris','Agnes','Vera','Asta','Saga','Maja'];
const N=314,DAY=120,SEASON=30, YEAR=120, names=['Anna','Erik','Mia','Oscar','Sofie','Lars','Emma','Noah','Freja','Oliver','Ida','Lucas'],colors=['#f2b97d','#c9a6f5','#f5d56d','#81d7ce','#ff999a','#b7d78b'],seed0=42517;
let inspectedBuilding=null;let state,selected=0,tab='people',god=false,paused=false,speed=1,last=performance.now(),acc=0,uiTimer=0,cam={x:58,y:63,scale:19},drag=null,dirty=false;
const canvas=document.getElementById('world'),ctx=canvas.getContext('2d'),vp=document.getElementById('viewport');
function rand(seed){let x=seed|0;return()=>{x^=x<<13;x^=x>>>17;x^=x<<5;return (x>>>0)/4294967296}}
let worldSeed=42517,r=rand(worldSeed);let stoneNodes=new Uint8Array(N*N),terrain=new Uint8Array(N*N),trees=new Uint8Array(N*N),berries=new Uint8Array(N*N),height=new Uint8Array(N*N),buildings=[];
function idx(x,y){return y*N+x}function inside(x,y){return x>=0&&y>=0&&x<N&&y<N}function cell(x,y){return inside(x,y)?terrain[idx(x,y)]:1}
function generate(){
 // Every NEW WORLD gets a different seed; loading an existing save preserves its exact terrain.
 const rr=rand(worldSeed^0x59f3),riverCount=3+Math.floor(rr()*4);
 terrain.fill(0);trees.fill(0);berries.fill(0);height.fill(0);
 for(let y=0;y<N;y++)for(let x=0;x<N;x++){
  const k=idx(x,y),wave=Math.sin(x*.071+worldSeed*.0003)+Math.cos(y*.09-worldSeed*.0002)+Math.sin((x+y)*.044);
  height[k]=Math.max(0,Math.min(8,Math.floor(4+wave+rr()*3)));
  const forestDensity=.25+.28*(.5+.5*Math.sin(x*.077+y*.043+worldSeed*.001));
  trees[k]=rr()<forestDensity?1:0;berries[k]=trees[k]&&rr()<.19?1:0;
 }
 // Meandering rivers; some flow vertically, some horizontally.
 for(let n=0;n<riverCount;n++){
  const vertical=rr()<.5,offset=22+rr()*(N-44),phase=rr()*6.28,amp=5+rr()*10,width=1.4+rr()*1.3;
  for(let t=0;t<N;t++){const middle=offset+Math.sin(t*.058+phase)*amp+Math.sin(t*.12+phase*.7)*2.8;
   for(let v=Math.floor(middle-width-1);v<=Math.ceil(middle+width+1);v++){
    const x=vertical?v:t,y=vertical?t:v;
    if(inside(x,y)&&Math.abs(v-middle)<=width){terrain[idx(x,y)]=1;trees[idx(x,y)]=0;berries[idx(x,y)]=0}
   }
  }
 }
 // Irregular lakes, each a different size and shape.
 const lakes=2+Math.floor(rr()*5);
 for(let n=0;n<lakes;n++){const cx=9+rr()*(N-18),cy=9+rr()*(N-18),rx=3+rr()*8,ry=3+rr()*7,phase=rr()*6.28;
  for(let y=Math.max(0,Math.floor(cy-ry-3));y<Math.min(N,cy+ry+3);y++)for(let x=Math.max(0,Math.floor(cx-rx-3));x<Math.min(N,cx+rx+3);x++){
   const a=Math.atan2((y-cy)/ry,(x-cx)/rx),dist=Math.hypot((x-cx)/rx,(y-cy)/ry),edge=1+.14*Math.sin(a*5+phase)+.1*Math.cos(a*3-phase);
   if(dist<edge){const k=idx(x,y);terrain[k]=1;trees[k]=0;berries[k]=0}
  }
 }
 // Preserve the iconic circular grassy starting clearing, with nearby water reachable.
 for(let y=48;y<=78;y++)for(let x=43;x<=73;x++){
  const d=Math.hypot(x-58,y-63),k=idx(x,y);
  if(d<=10.5){terrain[k]=0;trees[k]=0;berries[k]=0}
  else if(d<13&&terrain[k]===1){terrain[k]=0;trees[k]=0;berries[k]=0}
 }
 // Guaranteed accessible shoreline outside the clearing: a small pond to the east.
 const cx=75,cy=63;for(let y=cy-4;y<=cy+4;y++)for(let x=cx-5;x<=cx+5;x++){
  if(!inside(x,y))continue;const d=Math.hypot((x-cx)/5,(y-cy)/4),k=idx(x,y);
  if(d<.83){terrain[k]=1;trees[k]=0;berries[k]=0}
  else if(d<1.15){terrain[k]=0;trees[k]=0;berries[k]=0}
 }
 // Foraging bushes near founders, so the initial days are survivable.
 for(let i=0;i<30;i++){const a=rr()*Math.PI*2,d=11+rr()*7,x=Math.round(58+Math.cos(a)*d),y=Math.round(63+Math.sin(a)*d);if(inside(x,y)&&!terrain[idx(x,y)]){trees[idx(x,y)]=1;berries[idx(x,y)]=1}}
}

function log(msg){state.events.unshift({day:state.day,year:state.year,msg});state.events.length=Math.min(90,state.events.length);if(state.news){state.news.unshift({year:state.year,day:state.day,msg,category:/disagree|dispute|conflict/i.test(msg)?'Dispute':/leader|elect|board|proposal/i.test(msg)?'Politics':/discover|invent|boat/i.test(msg)?'Discovery':'Village life'});state.news.length=Math.min(250,state.news.length)}dirty=true}
function makePerson(i){let a=(i%12)*Math.PI*2/12,nation=i<12?0:1,ox=nation?248:58,oy=nation?248:63;return{id:i,nation,gold:250,name:names[i%12],surname:surnames[i%12],birthSurname:surnames[i%12],fatherId:null,motherId:null,partnerId:null,sex:i%2===0?'F':'M',birthYear:1,lastChildYear:-100,surnameChanges:0,x:ox+Math.cos(a)*5,y:oy+Math.sin(a)*5,age:18+Math.floor(r()*23),hunger:70+r()*25,thirst:70+r()*25,energy:70+r()*25,health:90+r()*10,food:1,wood:0,stone:0,skill:Math.floor(r()*20),trust:{},goal:'Explore',plan:'',memory:[],target:null,step:0,alive:true,traits:{curiosity:Math.round(r()*100),kindness:Math.round(r()*100),caution:Math.round(r()*100)},home:null}}
function generateStone(){stoneNodes=new Uint8Array(N*N);let rr=rand(worldSeed+991);for(let y=0;y<N;y++)for(let x=0;x<N;x++){let k=idx(x,y);if(terrain[k]===0&&!trees[k]&&(height[k]>=5||rr()<.08)&&rr()<.19)stoneNodes[k]=2+Math.floor(rr()*5)}}
function stoneAt(x,y){return inside(x,y)?stoneNodes[idx(x,y)]:0}
function ensureTransport(){if(!state.transport)state.transport={stoneTrips:0,stoneMined:0,woodTrips:0,foodTrips:0,failedRoutes:0}}
function physicalStone(p){ensureTransport();let spot=route(p,(x,y)=>stoneAt(x,y)>0,30);if(!spot){state.transport.failedRoutes++;return false}if(!(spot.arrived||walk(p,spot.target))){p.plan='Walking to a stone deposit';return true}let k=idx(spot.target.x,spot.target.y);if(!stoneNodes[k])return false;const tool=hasItem(p,'pickaxe')||hasItem(p,'stone_tool');const amount=Math.min(stoneNodes[k],Math.floor(freeCarry(p)/3),hasItem(p,'pickaxe')?4:tool?3:1);if(amount<1)return false;if(hasItem(p,'pickaxe'))useTool(p,'pickaxe');else if(hasItem(p,'stone_tool'))useTool(p,'stone_tool');stoneNodes[k]-=amount;p.stone+=amount;state.production.stoneGathered+=amount;state.transport.stoneMined+=amount;state.transport.stoneTrips++;p.energy=Math.max(0,p.energy-(tool?.4:1));learn(p,'Woodcraft',tool?.08:.04,'Collected stone');p.plan=tool?'Mined '+amount+' stone with a stone tool':'Collected a loose stone';return true}
function init(){worldSeed=(Math.floor(Math.random()*2147483646)+1);r=rand(worldSeed);generate();generateStone();state={year:1,day:1,t:0,people:Array.from({length:24},(_,i)=>makePerson(i)),events:[],births:0,deaths:0,discoveries:[],totalFood:0,structures:0,history:[],weather:'Clear',civilizations:1,worldSeed:worldSeed};state.nations=createNations();generateResources();log('Two independent nations founded their villages, with twelve adults each.');log('Each treasury holds 50,000 gold; every founder holds 250 gold.')}

// v3.0: Independent national treasuries and physical village markets.
const marketGoods={food:{label:'Apples / Food',base:6},fish:{label:'Fish',base:9},meat:{label:'Meat',base:13},wood:{label:'Wood',base:9},stone:{label:'Stone',base:13},iron:{label:'Iron',base:24},goldOre:{label:'Gold ore',base:55},plant:{label:'Medicinal plant',base:11},potion:{label:'Health potion',base:42},basket:{label:'Woven basket',base:42},fruitSeed:{label:'Fruit tree seed',base:7}};
function createNations(){return [{id:0,name:'Blue Village',color:'#508de0',x:58,y:63,treasury:50000,market:{x:61,y:62,stock:{food:0,fish:0,meat:0,wood:0,stone:0,iron:0,plant:0,potion:0,basket:0},paid:{},trades:0,volume:0},knownDeposits:[],exploreJobs:0,explorePaid:0},{id:1,name:'Red Village',color:'#df6565',x:248,y:248,treasury:50000,market:{x:251,y:247,stock:{food:0,fish:0,meat:0,wood:0,stone:0,iron:0,plant:0,potion:0,basket:0},paid:{},trades:0,volume:0},knownDeposits:[],exploreJobs:0,explorePaid:0}]}
function nations(){if(!Array.isArray(state.nations)||state.nations.length!==2)state.nations=createNations();for(const n of state.nations){n.knownDeposits??=[];n.exploreJobs??=0;n.explorePaid??=0;for(const k of Object.keys(marketGoods))n.market.stock[k]??=0;}return state.nations}
function marketPrice(n,key){const m=n.market,qty=m.stock[key]||0,base=marketGoods[key].base;return Math.max(1,Math.round(base*Math.max(.45,Math.min(2.6,1.45-qty/35))))}
function tradeAtMarket(p,n,key,kind){if(!p.alive||p.age<3||p.nation!==n.id)return false;if(!canAddItem(p,key,kind==='buy'?1:0))return false;const m=n.market,price=marketPrice(n,key);if(kind==='sell'){
 if((p[key]||0)<1||n.treasury<price)return false;if(key==='basket'&&hasItem(p,'basket')){p.items.basket--; }else p[key]--;m.stock[key]=(m.stock[key]||0)+1;n.treasury-=price;p.gold=(p.gold||0)+price;m.paid[key]=(m.paid[key]||0)+price;m.trades++;m.volume+=price;return true;
 }const sale=Math.ceil(price*1.25);if((m.stock[key]||0)<1||(p.gold||0)<sale)return false;m.stock[key]--;if(key==='basket'){ensureInventory(p);p.items.basket=(p.items.basket||0)+1}else p[key]=(p[key]||0)+1;p.gold-=sale;n.treasury+=sale;m.trades++;m.volume+=sale;return true}
function marketTick(){if(state.t%15!==0)return;for(const p of state.people){if(!p.alive||p.age<3)continue;const n=nations()[p.nation??0];if(!n)continue;const m=n.market,dist=Math.hypot(p.x-m.x,p.y-m.y);
 const saleKey=['goldOre','iron','meat','fish','plant','fruitSeed','wood','stone','food'].find(k=>(p[k]||0)>=(k==='wood'?6:k==='food'?5:2));
 const buyKey=p.health<65&&m.stock.potion>0?'potion':p.hunger<55&&(p.food||0)+(p.fish||0)+(p.meat||0)<2?['fish','meat','food'].find(k=>m.stock[k]>0):!hasItem(p,'basket')&&m.stock.basket>0?'basket':null;
 if(dist<3){if(buyKey&&tradeAtMarket(p,n,buyKey,'buy')){p.plan='Bought '+buyKey+' at the village market';if(buyKey==='potion'){p.potion--;p.health=100;p.plan='Drank a health potion and recovered fully'}}else if(saleKey&&tradeAtMarket(p,n,saleKey,'sell'))p.plan='Sold '+saleKey+' at the village market';}
 else if(dist<27&&p.hunger>58&&p.thirst>55&&p.energy>48&&(saleKey||buyKey)&&state.t%60===0){walkTo(p,(x,y)=>Math.hypot(x-m.x,y-m.y)<2,35);p.plan='Travelling to the '+n.name+' market';}
 }
 for(const n of nations()){const stock=n.market.stock;while(stock.plant>=2){stock.plant-=2;stock.potion++;} }
}
function marketView(esc){return `<h2>💰 National Markets</h2><p class="notice">Two independent markets. All prices are in gold. Selling price to citizens is 25% above the current market buying price (rounded up).</p>`+nations().map(n=>{const m=n.market;const citizens=state.people.filter(p=>p.alive&&p.nation===n.id);return `<div class="panel"><h3 style="color:${n.color}">${esc(n.name)}</h3><div class="grid"><div class="stat">Treasury<strong>${Math.round(n.treasury).toLocaleString('en-US')} G</strong></div><div class="stat">Population<strong>${citizens.length}</strong></div><div class="stat">Citizens' gold<strong>${citizens.reduce((v,p)=>v+(p.gold||0),0).toLocaleString('en-US')} G</strong></div><div class="stat">Completed trades<strong>${m.trades}</strong></div></div><table style="width:100%;margin-top:12px;text-align:left"><tr><th>Good</th><th>Stock</th><th>Buys</th><th>Sells</th></tr>${Object.keys(marketGoods).map(k=>`<tr><td>${marketGoods[k].label}</td><td>${m.stock[k]||0}</td><td>${marketPrice(n,k)} G</td><td>${Math.ceil(marketPrice(n,k)*1.25)} G</td></tr>`).join('')}</table><p><button data-focusnation="${n.id}">📍 Go to ${esc(n.name)}</button> <button data-explorejob="${n.id}">Post Explore job (40 G)</button></p><div class="event">Open Explore jobs: ${n.exploreJobs} · Paid: ${n.explorePaid} G · Known deposits: ${n.knownDeposits.length}</div>${n.knownDeposits.slice(-12).map(d=>`<div class="event">${d.kind} at (${d.x}, ${d.y}) · ${d.remaining} remaining</div>`).join('')}</div>`}).join('')}

// Persistent mineral deposits and harvestable medicinal plants.
let metalDeposits=[],wildPlants=[],fruitTrees=[];
function generateResources(){
 const rr=rand(worldSeed^0x613af);metalDeposits=[];wildPlants=[];fruitTrees=[];
 // A deposit is a 6x6 iron or 5x5 gold cluster with a finite number of physical ore tiles.
 // Clear any vegetation and loose stones in the ore footprint; never overlap water or buildings.
 const occupied=new Set();
 for(let attempt=0;attempt<420&&metalDeposits.length<88;attempt++){
  const kind=rr()<.77?'iron':'gold',size=kind==='iron'?6:5;
  const x=12+Math.floor(rr()*(N-24-size)),y=12+Math.floor(rr()*(N-24-size));
  if(Math.hypot(x-58,y-63)<25||Math.hypot(x-248,y-248)<25)continue;
  const cells=[];let valid=true;
  for(let dy=0;dy<size;dy++)for(let dx=0;dx<size;dx++){
   const tx=x+dx,ty=y+dy,k=idx(tx,ty);
   if(cell(tx,ty)!==0||occupied.has(k)){valid=false;break}
   cells.push({x:tx,y:ty,k});
  }
  if(!valid)continue;
  const amount=(kind==='iron'?8:2)+Math.floor(rr()*(kind==='iron'?26:22));
  // Distribute ore pieces across multiple tiles. Every mined unit disappears from its tile.
  const tiles=[];const shuffled=cells.slice().sort(()=>rr()-.5);const count=Math.min(amount,kind==='iron'?15:12);
  for(let i=0;i<count;i++)tiles.push({x:shuffled[i].x,y:shuffled[i].y,remaining:1});
  for(let i=count;i<amount;i++)tiles[Math.floor(rr()*tiles.length)].remaining++;
  for(const c of cells){trees[c.k]=0;berries[c.k]=0;stoneNodes[c.k]=0;occupied.add(c.k)}
  metalDeposits.push({x,y,kind,size,remaining:amount,tiles});
 }
 for(let i=0;i<650;i++){let x=3+Math.floor(rr()*(N-6)),y=3+Math.floor(rr()*(N-6));if(cell(x,y)===0&&!trees[idx(x,y)]&&!occupied.has(idx(x,y)))wildPlants.push({x,y,remaining:1+Math.floor(rr()*3)})}
 // Fruit trees are normal trees: they yield apples and can still be felled for wood.
 for(let y=2;y<N-2;y++)for(let x=2;x<N-2;x++){if(trees[idx(x,y)]&&rr()<.075)fruitTrees.push({x,y,apples:3+Math.floor(rr()*7)})}
}
function fruitAt(x,y){return fruitTrees.find(t=>t.x===x&&t.y===y&&trees[idx(x,y)]>0)}
function harvestFruit(p){const tree=fruitTrees.find(t=>t.apples>0&&trees[idx(t.x,t.y)]&&Math.hypot(t.x-p.x,t.y-p.y)<2.4);if(!tree||!canAddItem(p,'food')||r()>.22)return false;tree.apples--;p.food=(p.food||0)+1;p.plan='Picked an apple from a fruit tree';return true}
function plantFruitSeed(p){if(!(p.fruitSeed>0)||!canAddItem(p,'food',0)||r()>.08)return false;const x=Math.round(p.x),y=Math.round(p.y),k=idx(x,y);if(!inside(x,y)||cell(x,y)!==0||trees[k]||stoneNodes[k]||fruitAt(x,y)||metalDeposits.some(d=>d.tiles.some(t=>t.remaining>0&&t.x===x&&t.y===y)))return false;p.fruitSeed--;trees[k]=1;fruitTrees.push({x,y,apples:0,planted:state.t});p.plan='Planted a fruit tree seed';return true}
function refreshFruitTrees(){for(const t of fruitTrees){if(!trees[idx(t.x,t.y)])continue;if(t.planted&&state.t-t.planted<720)continue;t.apples=Math.min(10,t.apples+1)}}

const slotLimits={food:10,fish:10,meat:10,plant:10,potion:5,wood:5,stone:5,iron:3,goldOre:3,basket:1,fruitSeed:10};

function ensureLogistics(){

// Village Life: individual, persistent intentions, actual travel, and factual activity diaries.
function ensureRoutine(p){if(!p.routine||typeof p.routine!=='object')p.routine={habit:null,destination:null,until:0,lastDecision:0,lastReason:'',visits:0,homeReturns:0,workshopVisits:0,walks:0,diary:[]};if(!Array.isArray(p.routine.diary))p.routine.diary=[];return p.routine}
function activity(p,kind,reason){const a=ensureRoutine(p);if(a.habit===kind)return;a.habit=kind;a.lastReason=reason;a.lastDecision=state.t;a.diary.unshift({year:state.year,day:state.day,tick:state.t,kind,reason,x:p.x,y:p.y});a.diary.length=Math.min(a.diary.length,35)}
function chooseRoutine(p){const a=ensureRoutine(p),curiosity=(p.traits.curiosity||50),kindness=(p.traits.kindness||50),caution=(p.traits.caution||50);
 const candidates=[];
 if(familyHome(p))candidates.push({kind:'Return home',score:25+caution*.35+(p.energy<70?22:0),target:familyHome(p),reason:'Family shelter; values safety and recovery'});
 const partner=p.partnerId!=null?person(p.partnerId):null;
 if(partner&&partner.alive&&Math.hypot(partner.x-p.x,partner.y-p.y)<75)candidates.push({kind:'Visit partner',score:56+kindness*.22+(Math.hypot(partner.x-p.x,partner.y-p.y)<12?10:0),target:{x:partner.x,y:partner.y},personId:partner.id,reason:'Wants to spend time with partner'});
 const friends=state.people.filter(q=>q.alive&&q.id!==p.id&&q.age>=14&&Math.hypot(q.x-p.x,q.y-p.y)<35).map(q=>({q,rel:relationship(p,q)})).sort((a,b)=>b.rel.trust-a.rel.trust);
 if(friends.length){let f=friends[0];candidates.push({kind:'Visit friend',score:15+kindness*.42+Math.max(-15,Math.min(20,f.rel.trust*.25)),target:{x:f.q.x,y:f.q.y},personId:f.q.id,reason:'Prefers nearby company; trust '+Math.round(f.rel.trust)})}
 const ws=(state.workshops||[]).filter(w=>Math.hypot(w.x-p.x,w.y-p.y)<45).sort((a,b)=>Math.hypot(a.x-p.x,a.y-p.y)-Math.hypot(b.x-p.x,b.y-p.y));
 if(ws.length)candidates.push({kind:'Visit workshop',score:19+curiosity*.36+((p.skills||{}).Building||0)*.3,target:{x:ws[0].x,y:ws[0].y},reason:'Interested in nearby craft activity'});
 if(!candidates.length)return null;
 // Distinct personalities and an individual preference for repeating successful habits.
 for(const c of candidates){if(a.preferred===c.kind)c.score+=5;if(a.habit===c.kind)c.score-=24}
 candidates.sort((a,b)=>b.score-a.score);let chosen=candidates[0];a.scores=candidates.map(c=>({kind:c.kind,score:Math.round(c.score)}));return chosen}
function routineTick(){for(const p of state.people){if(!p.alive||p.age<3||p.fieldWork&&!p.fieldWork.paused)continue;let a=ensureRoutine(p);
 // Survival overrides social routines. No invisible teleportation.
 if(p.hunger<28||p.thirst<28||p.energy<18||p.health<30){if(a.destination){a.destination=null;a.until=0;activity(p,'Survival needs','Food, water, health or energy became urgent')}continue}

 let d=a.destination;if(d.personId!=null){let friend=person(d.personId);if(!friend||!friend.alive){a.destination=null;continue}d.x=friend.x;d.y=friend.y}
 const dist=Math.hypot(p.x-d.x,p.y-d.y);
 if(dist<=3){if(d.kind==='Return home'){a.homeReturns++;remember(p,'Returned home after travelling',2);p.energy=Math.min(100,p.energy+1.1)}else if(d.kind==='Visit workshop'){a.workshopVisits++;learn(p,'Building',.04,'Visited workshop')}else if(d.kind==='Visit friend'||d.kind==='Visit partner'){a.visits++;let friend=person(d.personId);if(friend){changeRelationship(p,friend,d.kind==='Visit partner'?3:2,'Completed '+d.kind.toLowerCase());changeRelationship(friend,p,d.kind==='Visit partner'?3:1,'Received visit');remember(p,'Visited '+fullName(friend),3);if(d.kind==='Visit partner')remember(friend,'Spent time with '+fullName(p),2);if(r()<.3)log(fullName(p)+' visited '+fullName(friend)+'.')}}
 p.goal=d.kind;p.plan='At destination: '+a.lastReason;a.destination=null;a.until=state.t+12;a.lastDecision=state.t;a.preferred=null;continue}
 const ox=p.x,oy=p.y;walkTo(p,(x,y)=>Math.hypot(x-d.x,y-d.y)<=3,100);if(ox!==p.x||oy!==p.y)a.walks++;

 }}

// Civilization systems: footprints, reciprocal trade, household formation, and earned social influence.
function ensureCivilization(){if(!state.civilization)state.civilization={traffic:{},pathsMade:0,trades:0,foodTraded:0,woodTraded:0,households:0,leaderId:null,leaderSince:0,leaderChanges:0,tradeLog:[],populationByYear:[]};const c=state.civilization;if(!c.traffic)c.traffic={};if(!c.tradeLog)c.tradeLog=[];return c}
function markFootpath(x,y,fromX,fromY){const c=ensureCivilization(),k=idx(x,y);if(terrain[k]===1)return;const before=c.traffic[k]||0;c.traffic[k]=Math.min(100,before+1);if(before===6)c.pathsMade++;
 // Record the actual traversed edge, so paths reflect direction rather than blanket tiles.
 if(!c.pathEdges)c.pathEdges={};if(Number.isFinite(fromX)&&Number.isFinite(fromY)){const a=idx(fromX,fromY),edge=a<k?a+':'+k:k+':'+a;c.pathEdges[edge]=Math.min(100,(c.pathEdges[edge]||0)+1)}
}
function nearVillage(p){const home=familyHome(p);return home&&Math.hypot(p.x-home.x,p.y-home.y)<10}
function socialStanding(p){let peers=state.people.filter(q=>q.alive&&q.id!==p.id&&q.age>=16&&Math.hypot(q.x-p.x,q.y-p.y)<24);let sum=0;for(const q of peers){const rel=relationship(q,p);sum+=Math.max(-30,Math.min(60,rel.trust))*.5+Math.min(20,rel.familiarity||0)*.4}return Math.round(sum+(p.traits?.kindness||50)*.12+(ensureSocial(p).giftsGiven||0)*.6+(ensureSocial(p).helpGiven||0)*.8)}
function civilizationTick(){const c=ensureCivilization();if(state.t%60!==0)return;
 // Family households coalesce through existing, physically built shelters.
 for(const p of state.people){if(!p.alive)continue;const home=familyHome(p);if(home&&!p.home)p.home={...home};if(p.partnerId!=null){const partner=person(p.partnerId);if(partner&&partner.alive&&home&&(!partner.home||Math.hypot(partner.home.x-home.x,partner.home.y-home.y)>12)){if(!partner.home)partner.home={...home}}}}
 const living=state.people.filter(p=>p.alive&&p.age>=16);
 // Barter: exchange actual carried goods, only face-to-face and if both benefit.
 const visited=new Set();for(const a of living){if(visited.has(a.id)||r()>.32)continue;const nearby=living.filter(b=>b.id!==a.id&&!visited.has(b.id)&&Math.hypot(a.x-b.x,a.y-b.y)<=3);if(!nearby.length)continue;const b=nearby[Math.floor(r()*nearby.length)];let seller=null,buyer=null,good='';if(a.food>=3&&a.wood<2&&b.wood>=3&&b.food<2){seller=a;buyer=b;good='food'}else if(b.food>=3&&b.wood<2&&a.wood>=3&&a.food<2){seller=b;buyer=a;good='food'}if(!seller)continue;
 // seller gives food, buyer gives wood; resources are conserved.
 seller.food--;seller.wood++;buyer.food++;buyer.wood--;c.trades++;c.foodTraded++;c.woodTraded++;visited.add(a.id);visited.add(b.id);changeRelationship(a,b,1,'Fair barter');changeRelationship(b,a,1,'Fair barter');c.tradeLog.unshift({year:state.year,day:state.day,a:a.id,b:b.id,detail:'1 food for 1 wood'});c.tradeLog.length=Math.min(35,c.tradeLog.length);if(r()<.12)log(fullName(a)+' and '+fullName(b)+' traded food for wood.')}
 // Influence is earned from nearby people's actual relationships, not an assigned office.
 if(false&&state.t%600===0&&living.length){const candidates=living.filter(p=>p.age>=3).map(p=>({p,score:socialStanding(p)})).sort((a,b)=>b.score-a.score);if(candidates.length&&candidates[0].score>=18){const chosen=candidates[0].p;if(c.leaderId!==chosen.id){const former=person(c.leaderId);if(!former||!former.alive||candidates[0].score>socialStanding(former)+10){c.leaderId=chosen.id;c.leaderSince=state.year;c.leaderChanges++;log(fullName(chosen)+' became a respected community figure through social ties.')}}}}

// v1.6: persistent, needs-driven occupations and collective construction.
const jobNames=['Farmer','Fisher','Forester','Miner','Craftsperson','Builder','Forager'];

function occupation(p){if(!p.occupation||!jobNames.includes(p.occupation))p.occupation='Forager';return p.occupation}
function occupationScore(p,job){const sk=p.skills||{},food=p.food||0,wood=p.wood||0,stone=p.stone||0;
 const scores={Farmer:(sk.Foraging||0)*1.1+(ensureEcosystem().farms.length?8:0),Fisher:(sk.Foraging||0)*.8+7,Forester:(sk.Woodcraft||0)+Math.max(0,5-wood)*3,Miner:(sk.Woodcraft||0)*.9+Math.max(0,4-stone)*3,Craftsperson:(sk.Woodcraft||0)*1.2+(tech(p,'stone_tools')?15:0),Builder:(sk.Building||0)*1.25+(p.home?5:0),Forager:(sk.Foraging||0)+Math.max(0,5-food)*3};
 let demand=0;const alive=state.people.filter(q=>q.alive&&q.age>=3),n=Math.max(1,alive.length);
 if(job==='Farmer')demand=ensureEcosystem().farms.length<Math.max(1,n/5)?8:3;
 if(job==='Fisher')demand=alive.filter(q=>occupation(q)==='Fisher').length>n/5?-5:6;
 if(job==='Builder')demand=ensureSociety().projects.some(q=>!q.done)?12:0;
 if(job==='Miner')demand=alive.reduce((a,q)=>a+(q.stone||0),0)<n*2?10:0;
 const preference={food_forage:'Forager',food_fish:'Fisher',food_farm:'Farmer',wood_collect:'Forester',stone_collect:'Miner'};const bonus=preference[p.strategy?.id]===job?20:0;return (scores[job]||0)+demand+bonus+(p.interest==='Building'&&job==='Builder'?5:0);
}
function chooseOccupation(p){if(!p.alive||p.age<3)return;const s=ensureSociety();const current=occupation(p);
 const ranked=jobNames.map(job=>({job,score:occupationScore(p,job)})).sort((a,b)=>b.score-a.score);
 const chosen=ranked[0];if(!p.occupationSince||chosen.score>occupationScore(p,current)+8){
  if(p.occupationSince&&chosen.job!==current)s.jobChanges++;else if(!p.occupationSince)s.jobsChosen++;
  p.occupation=chosen.job;p.occupationSince=state.t;remember(p,'Began working as '+chosen.job,3);
 }
}
function workOccupation(p){if(!p.alive||p.age<3||p.hunger<48||p.thirst<48||p.energy<38||p.fieldWork||p.carryWater)return false;
 if((state.t/12+p.id)%4!==0)return false;if(p.strategy?.id==='rest_early'&&p.energy<60)return false;
 const s=ensureSociety(),job=occupation(p);let worked=false;

 else if(job==='Fisher'&&p.food<6){worked=tryFishing(p);if(!worked){const spot=findFishingSpot(p);if(spot){walkTo(p,(x,y)=>x===spot.target.x&&y===spot.target.y,55);p.plan='Travelling to fishing grounds';worked=true}}}
 else if(job==='Craftsperson'&&tech(p,'stone_tools')&&p.wood>=2&&p.stone>=2){const v=recipes.find(v=>['axe','pickaxe','hoe'].includes(v.id)&&!hasItem(p,v.id)&&p.wood>=v.wood&&p.stone>=v.stone);if(v){ensureInventory(p);p.wood-=v.wood;p.stone-=v.stone;p.items[v.id]++;ensureProduction();state.production.crafted++;p.plan='Crafted '+v.name;worked=true}}

 else if(job==='Forester'&&p.wood<7){const k=dirs.map(([dx,dy])=>({x:p.x+dx,y:p.y+dy})).find(q=>inside(q.x,q.y)&&trees[idx(q.x,q.y)]);if(k&&freeCarry(p)>=2){const gain=Math.min(Math.floor(freeCarry(p)/2),hasItem(p,'axe')?3:1);trees[idx(k.x,k.y)]=0;p.wood+=gain;p.energy=Math.max(0,p.energy-2);if(hasItem(p,'axe'))useTool(p,'axe');p.plan='Felling timber for the community';worked=true}}

function projectSite(x,y){return inside(x,y)&&cell(x,y)===0&&!trees[idx(x,y)]&&!stoneAt(x,y)&&!buildings.some(b=>b.x===x&&b.y===y)&&!(state.stores||[]).some(b=>b.x===x&&b.y===y)&&!(state.workshops||[]).some(b=>b.x===x&&b.y===y)&&!ensureSociety().projects.some(b=>!b.done&&b.x===x&&b.y===y)&&!(ensureCivilization().traffic[idx(x,y)]>=12)}
function societyDaily(){const s=ensureSociety(),adults=state.people.filter(p=>p.alive&&p.age>=3);if(!adults.length)return;

  const groups=settlementGroups().filter(g=>g.homes.length>=2);
  for(const g of groups){const workshops=(state.workshops||[]).filter(b=>Math.hypot(b.x-g.x,b.y-g.y)<12).length;
   const stores=(state.stores||[]).filter(b=>Math.hypot(b.x-g.x,b.y-g.y)<12).length;

   const candidates=[];for(let dy=-6;dy<=6;dy++)for(let dx=-6;dx<=6;dx++){let x=Math.round(g.x)+dx,y=Math.round(g.y)+dy;if(projectSite(x,y)&&Math.hypot(dx,dy)>=3)candidates.push({x,y})}

   s.projects.push({id:state.t+'-'+s.projectsStarted,x:site.x,y:site.y,type,wood:0,stone:0,work:0,needWood:type==='Workshop'?8:6,needStone:type==='Workshop'?5:3,needWork:type==='Workshop'?24:18,done:false,started:state.t,contributors:{}});s.projectsStarted++;log('Villagers began planning a '+type.toLowerCase()+'.');break;

  const winner=[...votes].sort((a,b)=>b[1]-a[1])[0];if(winner){const c=ensureCivilization();if(c.leaderId!==winner[0]){c.leaderId=winner[0];c.leaderSince=state.year;c.leaderChanges++;log(fullName(person(winner[0]))+' was chosen as village leader.')}s.elections++}

function communityWork(){const s=ensureSociety();if(state.t%6!==0)return;

  const nearby=state.people.filter(p=>p.alive&&p.age>=3&&p.hunger>45&&p.thirst>45&&p.energy>30&&Math.hypot(p.x-proj.x,p.y-proj.y)<=3);

// Evolution systems operate on actual simulation state, with bounded per-day work.

function milestone(id,label){const e=ensureEvolution();if(e.milestones.some(m=>m.id===id))return;e.milestones.unshift({id,label,year:state.year,day:state.day});e.milestones=e.milestones.slice(0,100);log('Milestone: '+label)}
function evolutionDay(){const e=ensureEvolution(),living=state.people.filter(p=>p.alive),children=living.filter(p=>p.age<3),homes=buildings.filter(b=>b&&inside(b.x,b.y));e.populationPeak=Math.max(e.populationPeak,living.length);

function buildingAt(wx,wy){
 const groups=[['market',nations().map(n=>({...n.market,nation:n.id}))],['board',state.communication?.board?[state.communication.board]:[]],['boat',state.boating?.boats||[]],['store',state.stores||[]],['depot',state.logistics?.depots||[]],['workshop',state.workshops||[]],['home',buildings],['farm',state.ecosystem?.farms||[]],['bridge',state.infrastructure?.bridges||[]]];
 for(const [kind,items] of groups){for(let i=items.length-1;i>=0;i--){const b=items[i],size=kind==='farm'?(b.size||1):1.35;
 if(kind==='farm' ? (wx>=b.x+.08&&wx<=b.x+size-.08&&wy>=b.y+.08&&wy<=b.y+size-.08) : (wx>=b.x-.35&&wx<=b.x+size&&wy>=b.y-.55&&wy<=b.y+size))return {kind,item:b};}}
 return null;
}

else if(tab==='discoveries'){const all=Array.isArray(state.discoveries)?state.discoveries:[];el.innerHTML=`<h2>🔬 Discovery Journal</h2><div class="panel"><h3>Technology impact</h3><div class="grid"><div class="stat"><small>Bonus food gathered</small><strong>${state.techStats?.extraFood||0}</strong></div><div class="stat"><small>Bonus wood gathered</small><strong>${state.techStats?.extraWood||0}</strong></div><div class="stat"><small>Water-related illnesses</small><strong>${state.techStats?.waterIllness||0}</strong></div></div><p class="notice">Benefits apply only to villagers who know the technology.</p></div><div class="panel"><div class="grid"><div class="stat"><small>World discoveries</small><strong>${all.length}/${inventions.length}</strong></div><div class="stat"><small>Knowledge holders</small><strong>${state.people.filter(q=>q.alive&&Object.keys(q.knowledge||{}).length).length}</strong></div></div><p class="notice">Each villager must discover or learn techniques individually. Knowledge can disappear when the last person who knows it dies.</p></div>${inventions.map(v=>{let first=all.find(d=>d.id===v.id),holders=state.people.filter(q=>q.alive&&q.knowledge?.[v.id]);return `<div class="panel"><div class="row"><strong>${esc(v.name)}</strong><span class="pill">${first?'Discovered':'Unknown'}</span></div><p class="notice">${esc(v.description)}</p><small>Living knowledge holders: ${holders.length}</small>${first?`<div class="event">First discovered: Year ${first.year}, day ${first.day}<br>By ${esc(fullName(person(first.discoverer)||{name:'Unknown',surname:''}))}</div>`:''}<div class="notice">Prerequisites: ${v.prereq.length?v.prereq.map(id=>esc(inventions.find(a=>a.id===id).name)).join(', '):'None'}</div></div>`}).join('')}<div class="panel"><h3>Selected villager: ${esc(fullName(p))}</h3>${inventions.map(v=>`<div class="row event"><span>${esc(v.name)}</span><span>${p.knowledge?.[v.id]?'✓ Known':'—'}</span></div>`).join('')}<p class="notice">Experiments: ${p.experiments?.attempts||0} · Successful: ${p.experiments?.successes||0}</p></div>`}
else if(tab==='family'){const root=familyAncestors(p);const node=(v,depth=0)=>!v?'':`<div style="margin:7px 0 7px ${Math.min(depth,6)*12}px;padding:7px;border-left:2px solid #6b936c"><button data-person="${v.id}">${esc(v.name)}</button> <small>${v.alive?'Living':'Deceased'} · ${v.age} years</small>${v.father?`<div><small>Father:</small>${node(v.father,depth+1)}</div>`:''}${v.mother?`<div><small>Mother:</small>${node(v.mother,depth+1)}</div>`:''}</div>`;const descendants=(id,depth=0,seen=new Set())=>{if(depth>7||seen.has(id))return '';seen.add(id);return state.people.filter(q=>q.fatherId===id||q.motherId===id).map(q=>`<div style="margin-left:${Math.min(depth,6)*12}px;padding:6px;border-left:2px solid #6b936c"><button data-person="${q.id}">${esc(fullName(q))}</button> <small>${q.alive?'Living':'Deceased'} · ${q.age} years</small>${descendants(q.id,depth+1,new Set(seen))}</div>`).join('')};el.innerHTML=`<h2>🌳 Family Tree</h2><div class="panel"><label for="familyPerson">Selected person</label><select id="familyPerson" style="width:100%;margin:8px 0">${state.people.map(q=>`<option value="${q.id}" ${q.id===p.id?'selected':''}>${esc(fullName(q))}</option>`).join('')}</select><h3>Ancestors</h3>${node(root)}<h3>Descendants</h3>${descendants(p.id)||'<small>No descendants yet.</small>'}</div>`;el.querySelector('#familyPerson').onchange=e=>{selected=+e.target.value;render()};el.querySelectorAll('[data-person]').forEach(b=>b.onclick=()=>{selected=+b.dataset.person;render()})}
else if(tab==='history'){el.innerHTML=`<h2>📜 World History</h2><div class="panel">${state.events.map(e=>`<div class="event">${esc(e.msg)}<br><small>Year ${e.year}, day ${e.day}</small></div>`).join('')}</div>`}
else{el.innerHTML=`<h2>🌍 World & Controls</h2><div class="panel"><p>314 × 314 tile wilderness · settlements emerge from shelter clusters</p><p>One game day takes 2 real minutes at 1×. One year is 120 days.</p><p class="notice">Prototype features: individual discoveries, experiments, knowledge sharing, discovery journal, social trust, encounters, resource gifts, shelter assistance, disagreements, persistent goals, scored priorities, need-driven interruptions, failure memory, inherited and observed skills, mentorship, personal interests, ancestor/descendant family tree, partnerships, births, paternal surname inheritance, family links, child care and learning, unique founder surnames, reachable-target navigation, autonomous needs, foraging, water seeking, timber gathering, shelter building, basic social sharing, selective memories, yearly aging, seasons, local saves and observation tools.</p><p class="notice">Not implemented yet: advanced diplomacy, public jobs, taxes, international trade, and all-resource market integration.</p></div>${god?`<div class="panel"><h3>⚡ God Mode</h3><div class="buttons"><button id="giveFood">Give everyone food</button><button id="heal">Heal everyone</button><button id="forest">Regrow nearby forest</button><button id="nextDay">Advance one day</button><button id="newCivilization">Start new civilization</button></div></div>`:'<div class="panel">Enable God Mode in the top bar for world interventions.</div>'}<div class="panel"><h3>Save data</h3><div class="buttons"><button id="export">Export save</button><button id="reset">Reset world</button></div><p class="notice">Automatic local save every 30 seconds. Your browser may delete local data; export for backup.</p></div>`;if(god){el.querySelector('#giveFood').onclick=()=>{alive.forEach(p=>p.food+=5);log('God Mode: food granted.');render()};el.querySelector('#heal').onclick=()=>{alive.forEach(p=>p.health=100);log('God Mode: villagers healed.');render()};el.querySelector('#forest').onclick=()=>{for(let y=48;y<80;y++)for(let x=42;x<80;x++){let k=idx(x,y);if(!terrain[k]&&r()<.5)trees[k]=1}log('God Mode: forest regrown.');render()};el.querySelector('#nextDay').onclick=()=>{for(let i=0;i<60;i++)tick();render()};el.querySelector('#newCivilization').onclick=()=>{if(alive.length&&!confirm('Start a new civilization? This will replace the current villagers.'))return;state.civilizations++;state.people=Array.from({length:24},(_,i)=>makePerson(i));state.nations=createNations();state.births=0;selected=0;paused=false;log('A new group of founders arrived among the remnants.');render()}}el.querySelector('#export').onclick=()=>{let blob=new Blob([JSON.stringify(serialize())],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='ai-village-save.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};el.querySelector('#reset').onclick=()=>{if(confirm('Generate a completely NEW random world? Your current village will be replaced. Export your save first if you want to keep it.')){localStorage.removeItem('aiVillageV3Nations');buildings=[];cam={x:58,y:63,scale:19};init();ensureEcosystem();render()}}}}
function serialize(){return{state,terrain:Array.from(terrain),stoneNodes:Array.from(stoneNodes),metalDeposits,wildPlants,fruitTrees,trees:Array.from(trees),berries:Array.from(berries),height:Array.from(height),buildings,cam}}
function save(){try{localStorage.setItem('aiVillageV32Nations',JSON.stringify(serialize()));localStorage.setItem('aiVillageV32LastActive',String(Date.now()));return true}catch(e){alert('Save failed. Browser storage may be full.');return false}}
function load(){try{let s=JSON.parse(localStorage.getItem('aiVillageV32Nations')||localStorage.getItem('aiVillageV31Nations')||localStorage.getItem('aiVillageV3Nations'));if(!s||!s.state||s.terrain.length!==N*N)return false;state=s.state;worldSeed=state.worldSeed||42517;r=rand(worldSeed+state.t+1);state.people.forEach((p,i)=>{if(!p.surname)p.surname=surnames[i%12];if(!p.sex)p.sex=i%2===0?'F':'M';if(p.partnerId===undefined)p.partnerId=null;if(p.motherId===undefined)p.motherId=null;if(p.fatherId===undefined)p.fatherId=null;if(p.lastChildYear===undefined)p.lastChildYear=-100;if(p.birthYear===undefined)p.birthYear=1;if(!p.birthSurname)p.birthSurname=p.surname;if(p.surnameChanges===undefined)p.surnameChanges=0});terrain=Uint8Array.from(s.terrain);if(s.stoneNodes&&s.stoneNodes.length===N*N)stoneNodes=Uint8Array.from(s.stoneNodes);else generateStone();trees=Uint8Array.from(s.trees);berries=Uint8Array.from(s.berries);height=Uint8Array.from(s.height);buildings=s.buildings||[];if(Array.isArray(s.metalDeposits))metalDeposits=s.metalDeposits;if(Array.isArray(s.wildPlants))wildPlants=s.wildPlants;if(Array.isArray(s.fruitTrees))fruitTrees=s.fruitTrees;if(!s.metalDeposits||!s.wildPlants||!s.metalDeposits.every(d=>Array.isArray(d.tiles))){generateResources()}else if(!s.fruitTrees){const rr=rand(worldSeed^0xA881);fruitTrees=[];for(let y=2;y<N-2;y++)for(let x=2;x<N-2;x++)if(trees[idx(x,y)]&&rr()<.075)fruitTrees.push({x,y,apples:4})}cam=s.cam||cam;nations();for(const p of state.people){if(p.nation===undefined)p.nation=Math.hypot(p.x-58,p.y-63)<Math.hypot(p.x-248,p.y-248)?0:1;if(p.gold===undefined)p.gold=p.age>=3?250:0}return true}catch(e){return false}}
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});document.getElementById('pause').onclick=()=>{paused=!paused;document.getElementById('pause').textContent=paused?'▶ Resume':'⏸ Pause'};document.getElementById('speed').onchange=e=>speed=+e.target.value;document.getElementById('save').onclick=()=>{if(save())alert('Saved on this device.')};document.getElementById('newWorld').onclick=()=>{if(!confirm('Generate a completely new random world? Your current village will be replaced. Export a save first if you want to keep it.'))return;localStorage.removeItem('aiVillageV3Nations');buildings=[];cam={x:58,y:63,scale:19};selected=0;paused=false;init();ensureEcosystem();save();render()};document.getElementById('god').onclick=e=>{god=!god;e.target.classList.toggle('active',god);tab='world';render()};
function pointer(e){let rect=canvas.getBoundingClientRect();return{x:e.clientX-rect.left,y:e.clientY-rect.top}}
let pointers=new Map(),pinch=null;
canvas.addEventListener('pointerdown',e=>{canvas.setPointerCapture(e.pointerId);pointers.set(e.pointerId,pointer(e));if(pointers.size===1){drag={start:pointer(e),camx:cam.x,camy:cam.y,moved:false}}else if(pointers.size===2){let [a,b]=[...pointers.values()];pinch={dist:Math.hypot(a.x-b.x,a.y-b.y),scale:cam.scale};drag=null}});
canvas.addEventListener('pointermove',e=>{if(!pointers.has(e.pointerId))return;pointers.set(e.pointerId,pointer(e));if(pointers.size===2&&pinch){let [a,b]=[...pointers.values()];cam.scale=Math.max(6,Math.min(48,pinch.scale*Math.hypot(a.x-b.x,a.y-b.y)/Math.max(1,pinch.dist)))}else if(drag&&pointers.size===1){let q=pointer(e),dx=q.x-drag.start.x,dy=q.y-drag.start.y;if(Math.abs(dx)+Math.abs(dy)>7)drag.moved=true;cam.x=Math.max(0,Math.min(N,drag.camx-dx/cam.scale));cam.y=Math.max(0,Math.min(N,drag.camy-dy/cam.scale))}});
canvas.addEventListener('pointerup',e=>{let q=pointer(e);if(drag&&!drag.moved){let wx=cam.x+(q.x-vp.clientWidth/2)/cam.scale,wy=cam.y+(q.y-vp.clientHeight/2)/cam.scale;let nearest=state.people.filter(p=>p.alive).sort((a,b)=>Math.hypot(a.x-wx,a.y-wy)-Math.hypot(b.x-wx,b.y-wy))[0];if(nearest&&Math.hypot(nearest.x-wx,nearest.y-wy)<.72)selectPerson(nearest.id);else{const hit=buildingAt(wx,wy);if(hit)selectBuilding(hit);else if(nearest&&Math.hypot(nearest.x-wx,nearest.y-wy)<1.8)selectPerson(nearest.id)}}pointers.delete(e.pointerId);if(pointers.size<2)pinch=null;drag=null});
canvas.addEventListener('pointercancel',e=>{pointers.delete(e.pointerId);drag=null;pinch=null});
canvas.addEventListener('wheel',e=>{e.preventDefault();cam.scale=Math.max(6,Math.min(48,cam.scale*(e.deltaY>0?.9:1.1)))},{passive:false});
const existingWorld=load();if(!existingWorld)init();nations();if(!state.techStats)state.techStats={extraFood:0,extraWood:0,waterIllness:0};state.people.forEach(p=>{ensureLearning(p);ensureMind(p);ensureKnowledge(p);ensureInventory(p);ensureRoutine(p)});ensureProduction();ensureTransport();ensureEcosystem();if(!state.workshops)state.workshops=[];ensureCommunication();ensureBoats();repairPartnerships();if(!Number.isFinite(state.distanceWalked))state.distanceWalked=0;render();setInterval(()=>save(),30000);document.addEventListener('visibilitychange',()=>{if(document.hidden&&!offlineRunning)save()});

const APP_VERSION='3.1.0';
function versionParts(v){return String(v).replace(/^v/,'').split('.').map(x=>parseInt(x,10)||0)}
function newerVersion(a,b){const aa=versionParts(a),bb=versionParts(b);for(let i=0;i<3;i++){if((aa[i]||0)!==(bb[i]||0))return (aa[i]||0)>(bb[i]||0)}return false}
async function checkForUpdate(manual=false){if(!/^https?:$/.test(location.protocol)){if(manual)alert('Update checks require GitHub Pages.');return}const b=document.getElementById('checkUpdates');if(manual&&b){b.disabled=true;b.textContent='🔄 Checking…'}try{const res=await fetch('./version.json?check='+Date.now(),{cache:'no-store'});if(!res.ok)throw new Error('version.json unavailable');const info=await res.json();if(!info||typeof info.version!=='string')throw new Error('Invalid version.json');if(!newerVersion(info.version,APP_VERSION)){if(manual)alert('You are up to date: v'+APP_VERSION);return}const notice=document.getElementById('updateNotice');document.getElementById('updateMessage').textContent='AI Village v'+info.version+' is available. '+(info.notes||'Save and refresh to update.');notice.style.display='block';document.getElementById('updateNow').onclick=()=>{if(!save()){document.getElementById('updateStatus').textContent='Save failed; update cancelled.';return}location.reload()};document.getElementById('updateLater').onclick=()=>{notice.style.display='none'}}catch(e){if(manual)alert('Update check failed: '+e.message)}finally{if(b){b.disabled=false;b.textContent='🔄 Check updates'}}}
document.getElementById('checkUpdates').onclick=()=>checkForUpdate(true);
setTimeout(checkForUpdate,2500);setInterval(checkForUpdate,5*60*1000);

let offlineRunning=false;
function offlineCatchup(){
 if(!existingWorld){try{localStorage.setItem('aiVillageV32LastActive',String(Date.now()))}catch(_){}return}
 let then=Number(localStorage.getItem('aiVillageV32LastActive'));
 if(!Number.isFinite(then)||then<=0){save();return}
 const away=Math.max(0,Math.min(8*3600000,Date.now()-then));
 const total=Math.floor(away/2000); // Exactly 1x: one simulation tick per two real seconds.
 if(total<30)return;
 offlineRunning=true;
 const startYear=state.year,startDay=state.day,startPopulation=state.people.filter(p=>p.alive).length;
 const startBirths=state.births||0,startDeaths=state.deaths||0,startStructures=state.structures||0;
 const oldPaused=paused;paused=true;
 const panel=document.createElement('div');panel.id='offlineProgress';panel.style.cssText='position:fixed;inset:0;z-index:99999;background:#101d19ee;display:flex;align-items:center;justify-content:center;padding:20px;color:#fff;font-family:system-ui';
 panel.innerHTML='<div style="background:#20372e;border:1px solid #587d67;border-radius:14px;padding:22px;width:min(420px,100%);text-align:center"><h2>⏳ Offline Progress</h2><p id="offlineInfo">Simulating your village at 1× speed…</p><progress id="offlineBar" max="100" value="0" style="width:100%"></progress><p><button id="offlineSkip" style="padding:10px 18px">Stop catch-up</button></p></div>';
 document.body.appendChild(panel);
 let done=0,stop=false,failed=null;
 panel.querySelector('#offlineSkip').onclick=()=>{stop=true};
 const finish=()=>{
  offlineRunning=false;paused=oldPaused;acc=0;last=performance.now();
  save();panel.remove();dirty=true;
  const births=(state.births||0)-startBirths,deaths=(state.deaths||0)-startDeaths,structures=(state.structures||0)-startStructures;
  const elapsedDays=Math.floor(done/60);
  const message=failed?'Offline simulation stopped because of an error. Your progress was saved.\n'+String(failed.stack||failed):
   'While you were away ('+elapsedDays+' game days at 1×):\n'+
   'Births: '+births+' · Deaths: '+deaths+'\n'+
   'New shelters: '+structures+' · Population: '+startPopulation+' → '+state.people.filter(p=>p.alive).length+'\n'+
   'Current date: Year '+state.year+', Day '+state.day+(stop?'\nCatch-up stopped early.':'');
  alert(message);
 };
 const step=()=>{
  const deadline=performance.now()+12;
  try{while(done<total&&!stop&&performance.now()<deadline){tick();done++}}
  catch(e){failed=e;stop=true}
  panel.querySelector('#offlineBar').value=Math.round(done/total*100);
  panel.querySelector('#offlineInfo').textContent='Simulated '+Math.floor(done/60)+' of '+Math.floor(total/60)+' game days ('+Math.round(done/total*100)+'%)';
  if(done>=total||stop)finish();else setTimeout(step,0);
 };
 setTimeout(step,30);
}
setTimeout(offlineCatchup,100);
let simulationError=null;
function showSimulationError(err){if(simulationError)return;simulationError=err;paused=true;const info='AI Village v3.0.0 | Year '+state.year+', Day '+state.day+', Tick '+state.t+' | '+String(err&&err.stack||err);try{localStorage.setItem('aiVillageV3LastError',info)}catch(_){}const panel=document.createElement('div');panel.id='simulationErrorPanel';panel.style.cssText='position:fixed;z-index:999999;left:8px;right:8px;top:8px;background:#401c22;color:white;border:2px solid #ff9b9b;padding:14px;border-radius:12px;max-height:55vh;overflow:auto;font:14px system-ui';const heading=document.createElement('strong');heading.textContent='Simulation error detected — your save has not been deleted';panel.appendChild(heading);const pre=document.createElement('pre');pre.style.cssText='white-space:pre-wrap;overflow-wrap:anywhere;font-size:11px';pre.textContent=info;panel.appendChild(pre);const copy=document.createElement('button');copy.textContent='Copy error details';copy.onclick=()=>{if(navigator.clipboard?.writeText)navigator.clipboard.writeText(info);else prompt('Copy this error:',info)};panel.appendChild(copy);const close=document.createElement('button');close.textContent='Close';close.style.marginLeft='12px';close.onclick=()=>panel.remove();panel.appendChild(close);document.body.appendChild(panel)}
window.addEventListener('error',e=>{if(!simulationError)showSimulationError(e.error||new Error(e.message))});
function loop(now){try{let dt=Math.min(.15,(now-last)/1000);last=now;if(!paused&&!offlineRunning){acc+=dt*speed;let ticks=0;while(acc>=2&&acc<100&&ticks++<6){tick();acc-=2}}draw();uiTimer+=dt;if(uiTimer>.6){uiTimer=0;if(dirty){render();dirty=false}}}catch(err){showSimulationError(err)}requestAnimationFrame(loop)}requestAnimationFrame(loop);
})();
</script></body></html>
