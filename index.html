nt-size:12px;line-height:1.5;color:#b9cdb9}.hidden{display:none!important}@media(max-width:850px){main{display:block}#viewport{height:55dvh;min-height:300px}aside{border-left:0;border-top:1px solid #38523d;max-height:none}header{padding:9px}h1{font-size:16px}#hint{font-size:10px}}#updateNotice{display:none;position:fixed;z-index:1000;right:14px;bottom:14px;width:min(360px,calc(100vw - 28px));padding:15px;background:#263d2e;border:2px solid #9bbd79;border-radius:14px;box-shadow:0 12px 30px #0008}#updateNotice strong{display:block;margin-bottom:7px}#updateNotice p{font-size:13px;line-height:1.4}#updateNotice .buttons{display:flex;gap:8px}#updateNotice button{flex:1}#updateStatus{font-size:12px;color:#a8bea9} .popbar{height:9px;background:#344b3b;border-radius:4px;overflow:hidden}.popbar span{display:block;height:100%;background:#91c978} .milestone{border-left:3px solid #c6a56e;padding:8px;margin:8px 0;background:#2a392e} </style></head>

<script>
(()=>{'use strict';
const surnames=['Ashwood','Riverbend','Oakheart','Stonefield','Willowmere','Northbrook','Fernholm','Brightwater','Thornhill','Meadowcroft','Redleaf','Ironwood'];
const fullName=p=>p.name+' '+(p.surname||surnames[p.id%12]);
const boyNames=['Theo','Felix','Elias','Milo','Hugo','Anton','Leo','August','Emil','Arthur','Finn','Otto'];
const girlNames=['Alma','Luna','Ella','Nora','Clara','Liv','Iris','Agnes','Vera','Asta','Saga','Maja'];
const N=314,DAY=120,SEASON=30, YEAR=120, names=['Anna','Erik','Mia','Oscar','Sofie','Lars','Emma','Noah','Freja','Oliver','Ida','Lucas'],colors=['#f2b97d','#c9a6f5','#f5d56d','#81d7ce','#ff999a','#b7d78b'],seed0=42517;
let worldSettings={nations:2,citizens:12,stock:10};
let inspectedBuilding=null;let state,selected=0,tab='people',god=false,paused=false,speed=1,last=performance.now(),acc=0,uiTimer=0,cam={x:58,y:63,scale:19},drag=null,dirty=false;
const canvas=document.getElementById('world'),ctx=canvas.getContext('2d'),vp=document.getElementById('viewport');
function rand(seed){let x=seed|0;return()=>{x^=x<<13;x^=x>>>17;x^=x<<5;return (x>>>0)/4294967296}}
let worldSeed=42517,r=rand(worldSeed);let stoneNodes=new Uint8Array(N*N),terrain=new Uint8Array(N*N),trees=new Uint8Array(N*N),berries=new Uint8Array(N*N),height=new Uint8Array(N*N),buildings=[];
function idx(x,y){return y*N+x}function inside(x,y){return x>=0&&y>=0&&x<N&&y<N}function cell(x,y){return inside(x,y)?terrain[idx(x,y)]:1}
function generate(){
 // Every NEW WORLD gets a different seed; loading an existing save preserves its exact terrain.
 const rr=rand(worldSeed^0x59f3),riverCount=3+Math.floor(rr()*4);
 terrain.fill(0);trees.fill(0);berries.fill(0);height.fill(0);
 for(let y=0;y<N;y++)for(let x=0;x<N;x++){
  const k=idx(x,y),wave=Math.sin(x*.071+worldSeed*.0003)+Math.cos(y*.09-worldSeed*.0002)+Math.sin((x+y)*.044);
  height[k]=Math.max(0,Math.min(8,Math.floor(4+wave+Math.sin(x*.019+y*.031+worldSeed*.0002)*1.4+rr()*3)));
  const forestDensity=.25+.28*(.5+.5*Math.sin(x*.077+y*.043+worldSeed*.001));
  trees[k]=rr()<forestDensity?1:0;berries[k]=trees[k]&&rr()<.19?1:0;
 }
 // Meandering rivers; some flow vertically, some horizontally.
 for(let n=0;n<riverCount;n++){
  const vertical=rr()<.5,offset=22+rr()*(N-44),phase=rr()*6.28,amp=5+rr()*10,width=1.4+rr()*1.3;
  for(let t=0;t<N;t++){const middle=offset+Math.sin(t*.058+phase)*amp+Math.sin(t*.12+phase*.7)*2.8;
   for(let v=Math.floor(middle-width-1);v<=Math.ceil(middle+width+1);v++){
    const x=vertical?v:t,y=vertical?t:v;
    if(inside(x,y)&&Math.abs(v-middle)<=width){terrain[idx(x,y)]=1;trees[idx(x,y)]=0;berries[idx(x,y)]=0}
   }
  }
 }
 // Irregular lakes, each a different size and shape.
 const lakes=2+Math.floor(rr()*5);
 for(let n=0;n<lakes;n++){const cx=9+rr()*(N-18),cy=9+rr()*(N-18),rx=3+rr()*8,ry=3+rr()*7,phase=rr()*6.28;
  for(let y=Math.max(0,Math.floor(cy-ry-3));y<Math.min(N,cy+ry+3);y++)for(let x=Math.max(0,Math.floor(cx-rx-3));x<Math.min(N,cx+rx+3);x++){
   const a=Math.atan2((y-cy)/ry,(x-cx)/rx),dist=Math.hypot((x-cx)/rx,(y-cy)/ry),edge=1+.14*Math.sin(a*5+phase)+.1*Math.cos(a*3-phase);
   if(dist<edge){const k=idx(x,y);terrain[k]=1;trees[k]=0;berries[k]=0}
  }
 }
 // Preserve the iconic circular grassy starting clearing, with nearby water reachable.
 for(let y=48;y<=78;y++)for(let x=43;x<=73;x++){
  const d=Math.hypot(x-58,y-63),k=idx(x,y);
  if(d<=10.5){terrain[k]=0;trees[k]=0;berries[k]=0}
  else if(d<13&&terrain[k]===1){terrain[k]=0;trees[k]=0;berries[k]=0}
 }
 // Guaranteed accessible shoreline outside the clearing: a small pond to the east.
 const cx=75,cy=63;for(let y=cy-4;y<=cy+4;y++)for(let x=cx-5;x<=cx+5;x++){
  if(!inside(x,y))continue;const d=Math.hypot((x-cx)/5,(y-cy)/4),k=idx(x,y);
  if(d<.83){terrain[k]=1;trees[k]=0;berries[k]=0}
  else if(d<1.15){terrain[k]=0;trees[k]=0;berries[k]=0}
 }
 // Foraging bushes near founders, so the initial days are survivable.
 for(let i=0;i<30;i++){const a=rr()*Math.PI*2,d=11+rr()*7,x=Math.round(58+Math.cos(a)*d),y=Math.round(63+Math.sin(a)*d);if(inside(x,y)&&!terrain[idx(x,y)]){trees[idx(x,y)]=1;berries[idx(x,y)]=1}}
}

function log(msg){state.events.unshift({day:state.day,year:state.year,msg});state.events.length=Math.min(90,state.events.length);if(state.news){state.news.unshift({year:state.year,day:state.day,msg,category:/disagree|dispute|conflict/i.test(msg)?'Dispute':/leader|elect|board|proposal/i.test(msg)?'Politics':/discover|invent|boat/i.test(msg)?'Discovery':'Village life'});state.news.length=Math.min(250,state.news.length)}dirty=true}
function makePerson(i){const count=worldSettings.citizens||12,nation=Math.floor(i/count),n=worldSettings.nations||2,anchor=nationAnchor(nation,n),a=(i%count)*Math.PI*2/count;return{id:i,nation,gold:250,name:names[i%12],surname:surnames[i%12],birthSurname:surnames[i%12],fatherId:null,motherId:null,partnerId:null,sex:i%2===0?'F':'M',birthYear:1,lastChildYear:-100,surnameChanges:0,x:anchor.x+Math.cos(a)*5,y:anchor.y+Math.sin(a)*5,age:18+Math.floor(r()*23),hunger:70+r()*25,thirst:70+r()*25,energy:70+r()*25,health:90+r()*10,food:1,wood:0,stone:0,skill:Math.floor(r()*20),trust:{},goal:'Explore',plan:'',memory:[],target:null,step:0,alive:true,traits:{curiosity:Math.round(r()*100),kindness:Math.round(r()*100),caution:Math.round(r()*100)},home:null}}
function nationAnchor(i,total){if(total===1)return{x:58,y:63};if(total===2)return i===0?{x:58,y:63}:{x:248,y:248};return [{x:58,y:63},{x:248,y:248},{x:58,y:248},{x:248,y:63}][i]}
function prepareNationClearing(x,y){for(let yy=y-12;yy<=y+12;yy++)for(let xx=x-12;xx<=x+12;xx++){if(!inside(xx,yy))continue;const d=Math.hypot(xx-x,yy-y),k=idx(xx,yy);if(d<10){terrain[k]=0;trees[k]=0;berries[k]=0}}}

function generateStone(){stoneNodes=new Uint8Array(N*N);let rr=rand(worldSeed+991);for(let y=0;y<N;y++)for(let x=0;x<N;x++){let k=idx(x,y);if(terrain[k]===0&&!trees[k]&&(height[k]>=5||rr()<.08)&&rr()<.19)stoneNodes[k]=2+Math.floor(rr()*5)}}
function stoneAt(x,y){return inside(x,y)?stoneNodes[idx(x,y)]:0}
function ensureTransport(){if(!state.transport)state.transport={stoneTrips:0,stoneMined:0,woodTrips:0,foodTrips:0,failedRoutes:0}}
function physicalStone(p){ensureTransport();let spot=route(p,(x,y)=>stoneAt(x,y)>0,30);if(!spot){state.transport.failedRoutes++;return false}if(!(spot.arrived||walk(p,spot.target))){p.plan='Walking to a stone deposit';return true}let k=idx(spot.target.x,spot.target.y);if(!stoneNodes[k])return false;const tool=hasItem(p,'pickaxe')||hasItem(p,'stone_tool');const amount=Math.min(stoneNodes[k],Math.floor(freeCarry(p)/3),hasItem(p,'pickaxe')?4:tool?3:1);if(amount<1)return false;if(hasItem(p,'pickaxe'))useTool(p,'pickaxe');else if(hasItem(p,'stone_tool'))useTool(p,'stone_tool');stoneNodes[k]-=amount;p.stone+=amount;state.production.stoneGathered+=amount;state.transport.stoneMined+=amount;state.transport.stoneTrips++;p.energy=Math.max(0,p.energy-(tool?.4:1));learn(p,'Woodcraft',tool?.08:.04,'Collected stone');p.plan=tool?'Mined '+amount+' stone with a stone tool':'Collected a loose stone';return true}
function init(){worldSeed=(Math.floor(Math.random()*2147483646)+1);r=rand(worldSeed);generate();for(let i=0;i<worldSettings.nations;i++){const a=nationAnchor(i,worldSettings.nations);prepareNationClearing(a.x,a.y)}generateStone();state={year:1,day:1,t:0,people:Array.from({length:worldSettings.nations*worldSettings.citizens},(_,i)=>makePerson(i)),events:[],births:0,deaths:0,discoveries:[],totalFood:0,structures:0,history:[],weather:'Clear',civilizations:1,worldSeed:worldSeed,worldSettings:{...worldSettings}};state.nations=createNations();generateResources();log(worldSettings.nations+' nations founded villages with '+worldSettings.citizens+' adults each.');log('Each treasury holds 50,000 gold; every founder holds 250 gold.')}

// v3.0: Independent national treasuries and physical village markets.
const marketGoods={wheat:{label:'Wheat 🌾',base:7},bread:{label:'Bread 🍞',base:22},food:{label:'Apples / Food',base:6},fish:{label:'Fish',base:9},meat:{label:'Meat',base:13},wood:{label:'Wood',base:9},stone:{label:'Stone',base:13},iron:{label:'Iron',base:24},goldOre:{label:'Gold ore',base:55},plant:{label:'Medicinal plant',base:11},potion:{label:'Health potion',base:42},basket:{label:'Woven basket',base:42},fruitSeed:{label:'Fruit tree seed',base:7},boat:{label:'Boat 🛶',base:225}};
function createNations(){const labels=['Blue','Red','Green','Gold'],palette=['#508de0','#df6565','#6bc987','#edc45c'];return Array.from({length:worldSettings.nations},(_,i)=>{const a=nationAnchor(i,worldSettings.nations),stock={};for(const k of Object.keys(marketGoods))stock[k]=k==='boat'?0:worldSettings.stock;return{id:i,name:labels[i]+' Village',color:palette[i],x:a.x,y:a.y,treasury:50000,market:{x:a.x+3,y:a.y-1,stock,paid:{},trades:0,volume:0},marketOutposts:[],knownDeposits:[],exploreJobs:0,explorePaid:0}})}
function nations(){if(!Array.isArray(state.nations)||!state.nations.length)state.nations=createNations();for(const n of state.nations){n.knownDeposits??=[];n.exploreJobs??=0;n.explorePaid??=0;n.marketOutposts??=[];for(const k of Object.keys(marketGoods))n.market.stock[k]??=0}return state.nations}
function marketLocations(n){return [n.market,...(n.marketOutposts||[])]}
function nearestMarket(n,p){return marketLocations(n).reduce((a,b)=>Math.hypot(p.x-a.x,p.y-a.y)<=Math.hypot(p.x-b.x,p.y-b.y)?a:b)}
function marketDistance(n,p){const m=nearestMarket(n,p);return Math.hypot(p.x-m.x,p.y-m.y)}
function outpostDaily(n){if(state.day%15!==0||n.treasury<1200)return;const residents=state.people.filter(p=>p.alive&&p.nation===n.id&&p.age>=3);const candidates=residents.filter(p=>marketDistance(n,p)>35).sort((a,b)=>marketDistance(n,b)-marketDistance(n,a));for(const p of candidates.slice(0,12)){const x=Math.round(p.x),y=Math.round(p.y);if(!inside(x,y)||terrain[idx(x,y)]||trees[idx(x,y)]||stoneAt(x,y)||buildings.some(b=>Math.hypot(b.x-x,b.y-y)<3)||enterpriseState().sites.some(b=>Math.hypot(b.x-x,b.y-y)<3))continue;n.marketOutposts.push({x,y});n.treasury-=1200;log(n.name+' opened a remote market at ('+x+', '+y+'). All national shops share inventory.');break}}

function marketPrice(n,key){const m=n.market,qty=m.stock[key]||0,base=marketGoods[key].base;return Math.max(1,Math.round(base*Math.max(.45,Math.min(2.6,1.45-qty/35))))}
function tradeAtMarket(p,n,key,kind){if(!p.alive||p.age<3||p.nation!==n.id)return false;if(!canAddItem(p,key,kind==='buy'?1:0))return false;const m=n.market,price=marketPrice(n,key);if(kind==='sell'){
 if((p[key]||0)<1||n.treasury<price)return false;if(key==='basket'&&hasItem(p,'basket')){p.items.basket--; }else p[key]--;m.stock[key]=(m.stock[key]||0)+1;n.treasury-=price;p.gold=(p.gold||0)+price;m.paid[key]=(m.paid[key]||0)+price;m.trades++;m.volume+=price;p.happiness=Math.min(100,(p.happiness??55)+2);return true;
 }const sale=Math.ceil(price*1.25);if((m.stock[key]||0)<1||(p.gold||0)<sale)return false;m.stock[key]--;if(key==='basket'){ensureInventory(p);p.items.basket=(p.items.basket||0)+1}else p[key]=(p[key]||0)+1;p.gold-=sale;n.treasury+=sale;m.trades++;m.volume+=sale;p.happiness=Math.min(100,(p.happiness??55)+2);return true}
// v3.3: Individual economic decisions. No external AI or paid API.
function economicMind(p){if(!p.economics)p.economics={experience:{},decisions:0,savedTime:0,spent:0,earned:0,last:null};return p.economics}
function economicExperience(p,key){const e=economicMind(p).experience;return e[key]||(e[key]={buy:0,gather:0,buyTime:0,gatherTime:0})}
function economicLearn(p,key,method,elapsed,price=0){const e=economicExperience(p,key),time=Math.max(1,elapsed);e[method]++;e[method+'Time']+=time;const mind=economicMind(p);mind.decisions++;mind.last={key,method,time,price,year:state.year,day:state.day};if(method==='buy'){mind.spent+=price;mind.savedTime+=Math.max(0,(e.gatherTime/e.gather||24)-time)}else mind.earned+=0;}
function economicNeed(p){if(!p.alive||p.age<3||p.hunger<47||p.thirst<43||p.energy<38)return null;
 const buildCost=techEffects(p).buildCost,missingWood=(!p.home||p.goal==='Build shelter')?Math.max(0,buildCost-(p.wood||0)):0;
 if(missingWood>=1)return {key:'wood',need:missingWood};
 const food=(p.food||0)+(p.fish||0)+(p.meat||0);if(food<2&&p.hunger<78)return {key:'food',need:2-food};return null}
function economicChoice(p){const n=nations()[p.nation||0],m=n.market,need=economicNeed(p);if(!need)return null;
 const key=need.key,stock=m.stock[key]||0,qty=Math.min(need.need,stock,key==='wood'?5:3);
 if(qty<=0||!canAddItem(p,key,qty))return null;
 const unit=Math.ceil(marketPrice(n,key)*1.25),cost=qty*unit;if((p.gold||0)<cost+Math.max(8,(p.traits.caution||50)*.25))return null;
 const distance=marketDistance(n,p),walkTicks=distance*2.4+8;
 const exp=economicExperience(p,key),gatherUnit=exp.gather?exp.gatherTime/exp.gather: key==='wood'?28:38;
 const gatherTicks=gatherUnit*qty,shoppingTicks=walkTicks+qty*3;
 // Value of time rises when tired, experienced or wealthy; cautious citizens require a larger advantage.
 const hourlyValue=1.2+(p.skill||0)*.06+Math.min(4,(p.gold||0)/220);
 const caution=(p.traits.caution||50)/100;
 const buyScore=(gatherTicks-shoppingTicks)*hourlyValue-cost*(.7+caution*.65);
 // Exploration: sometimes try a marginally worse option and remember the outcome.
 const explore=(p.traits.curiosity||50)/100*.12;
 return buyScore>0||r()<explore&&buyScore>-cost*.25?{key,qty,cost,unit,reason:buyScore>0?'Saving work time':'Testing market alternative'}:null}
function economicTick(p){const mind=economicMind(p),n=nations()[p.nation||0],m=n.market;
 if(p.economicOrder){const o=p.economicOrder,dist=marketDistance(n,p);
  if(p.hunger<35||p.thirst<32||p.energy<25||state.t-o.started>480){p.economicOrder=null;return false}
  if(dist<2.6){let bought=0,spent=0;for(let i=0;i<o.qty;i++){const price=Math.ceil(marketPrice(n,o.key)*1.25);if(!tradeAtMarket(p,n,o.key,'buy'))break;bought++;spent+=price}
   if(bought){economicLearn(p,o.key,'buy',state.t-o.started,spent);p.plan='Bought '+bought+' '+o.key+' to save work time';remember(p,'Compared gathering with buying '+o.key,2)}
   p.economicOrder=null;return bought>0}
  if(state.t%9===0){walkTo(p,(x,y)=>Math.hypot(x-m.x,y-m.y)<2.5,Math.max(35,Math.min(110,Math.ceil(dist+12))));p.plan='Shopping for '+o.key+' ('+o.reason+')'}return true;
 }
 if(state.t%60!==p.id%60)return false;
 const decision=economicChoice(p);if(!decision)return false;
 p.economicOrder={...decision,started:state.t};mind.lastDecision={key:decision.key,reason:decision.reason,expectedCost:decision.cost};p.plan='Decided to buy '+decision.key+' instead of gathering';return true;
}
function marketTick(){if(state.t%15!==0)return;for(const p of state.people){if(!p.alive||p.age<3||p.economicOrder||p.merchantTrip)continue;const n=nations()[p.nation??0];if(!n)continue;const m=nearestMarket(n,p),dist=Math.hypot(p.x-m.x,p.y-m.y);
 const saleKey=['goldOre','iron','meat','fish','plant','fruitSeed','wood','stone','wheat','food'].find(k=>(p[k]||0)>=(k==='wood'?6:k==='food'?5:2));
 const buyKey=p.health<65&&m.stock.potion>0?'potion':p.hunger<55&&(p.food||0)+(p.fish||0)+(p.meat||0)<2?['bread','fish','meat','food'].find(k=>m.stock[k]>0):!hasItem(p,'basket')&&m.stock.basket>0?'basket':null;

function ensureInnovation(){if(!state.innovation)state.innovation={proposals:[],completed:0,failed:0,adopted:0,ideas:0};const s=state.innovation;if(!Array.isArray(s.proposals))s.proposals=[];s.proposals=s.proposals.filter(q=>q&&typeof q==='object'&&typeof q.concept==='string').slice(0,75);for(const q of s.proposals){if(!Array.isArray(q.supporters))q.supporters=[];if(!Number.isFinite(q.progress))q.progress=0;}return s}
function personalStrategy(p){if(!p.strategy||typeof p.strategy!=='object')p.strategy={id:null,start:0,baseline:0,attempts:0,results:[],preference:{},lastIdea:0};if(!Array.isArray(p.strategy.results))p.strategy.results=[];p.strategy.results=p.strategy.results.filter(q=>q&&typeof q==='object'&&!Array.isArray(q)).slice(0,30);if(!p.strategy.preference||typeof p.strategy.preference!=='object')p.strategy.preference={};return p.strategy}
function strategyMetric(p,metric){if(metric==='food')return (p.food||0)+(p.social?.giftsGiven||0)*.15;if(metric==='wood')return p.wood||0;if(metric==='stone')return p.stone||0;if(metric==='energy')return p.energy||0;return -(p.routine?.walks||0)}
function strategyNeed(p){if(p.food<4||p.hunger<60)return 'Food';if(seasonIndex()===3&&p.wood<3)return 'Wood';if(p.energy<40)return 'Energy';if((p.stone||0)<2&&occupation(p)==='Builder')return 'Stone';return 'Logistics'}
function strategyDaily(){const system=ensureInnovation();const adults=state.people.filter(p=>p.alive&&p.age>=3);for(const p of adults){const s=personalStrategy(p);if(s.id){const strategy=strategyLibrary.find(q=>q.id===s.id);if(strategy&&state.t-s.start>=300){const gain=strategyMetric(p,strategy.metric)-s.baseline;const success=gain>(strategy.metric==='energy'?4:strategy.metric==='distance'?0:0);s.results.unshift({id:s.id,year:state.year,day:state.day,gain:Math.round(gain*10)/10,success});s.results.length=12;s.preference[s.id]=Math.max(-5,Math.min(5,(s.preference[s.id]||0)+(success?1:-1)));if(success){system.adopted++;remember(p,'My experiment with '+strategy.name.toLowerCase()+' helped.',4)}else system.failed++;s.id=null}}
 if(!s.id&&p.hunger>35&&p.thirst>35&&p.energy>25&&r()<.045){const need=strategyNeed(p);let choices=strategyLibrary.filter(q=>q.domain===need);if(!choices.length)choices=strategyLibrary.filter(q=>q.domain==='Food');choices.sort((a,b)=>(s.preference[b.id]||0)-(s.preference[a.id]||0));const chosen=choices[Math.floor(r()*Math.min(2,choices.length))];s.id=chosen.id;s.start=state.t;s.baseline=strategyMetric(p,chosen.metric);s.attempts++;p.plan='Testing: '+chosen.name;remember(p,'Started testing '+chosen.name.toLowerCase(),3)}
 if(!s.id&&state.t-s.lastIdea>2400&&r()<.018){const need=strategyNeed(p),options=inventionConcepts.filter(q=>q.need===need);const idea=options[Math.floor(r()*options.length)]||inventionConcepts[Math.floor(r()*inventionConcepts.length)];s.lastIdea=state.t;const exists=system.proposals.some(q=>q.concept===idea.id&&q.status!=='Rejected');if(exists)continue;const proposal={id:'idea-'+state.t+'-'+p.id,concept:idea.id,author:p.id,year:state.year,day:state.day,title:idea.name,description:idea.description,status:'Proposed',supporters:[],notes:'',progress:0};system.proposals.unshift(proposal);if(system.proposals.length>75)system.proposals.length=75;system.ideas++;log(fullName(p)+' proposed '+idea.name+'.');const c=ensureCommunication();c.posts.unshift({id:proposal.id,author:p.id,year:state.year,day:state.day,tick:state.t,topic:'Invention',text:idea.description,proposalId:proposal.id});if(c.posts.length>100)c.posts.length=100}}
 for(const proposal of system.proposals){if(!proposal||typeof proposal!=='object')continue;if(proposal.status!=='Proposed'&&proposal.status!=='Experimenting')continue;const idea=inventionConcepts.find(q=>q.id===proposal.concept);if(!idea)continue;const author=person(proposal.author);if(!author?.alive)continue;if(proposal.status==='Proposed'){for(const p of adults){if(p.id===author.id||proposal.supporters.includes(p.id))continue;if(Math.hypot(p.x-author.x,p.y-author.y)<5&&r()<.02&&p.traits.curiosity>35)proposal.supporters.push(p.id)}if(proposal.supporters.length>=2&&idea.effect)proposal.status='Experimenting'}else if(idea.effect&&r()<.07){proposal.progress++;if(proposal.progress>=8){proposal.status='Implemented';proposal.yearCompleted=state.year;proposal.dayCompleted=state.day;system.completed++;log(fullName(author)+' and neighbors developed '+idea.name+'.')}}}
}

function enterpriseState(){if(!state.enterprises)state.enterprises={sites:[],nextId:1,transactions:0};return state.enterprises}
function enterpriseSiteFree(x,y,size=1){for(let dy=0;dy<size;dy++)for(let dx=0;dx<size;dx++){
 const xx=x+dx,yy=y+dy;if(!inside(xx,yy)||cell(xx,yy)!==0||trees[idx(xx,yy)]||stoneAt(xx,yy)>0||!projectSite(xx,yy))return false;
 for(const b of enterpriseState().sites)if(xx>=b.x&&xx<b.x+b.size&&yy>=b.y&&yy<b.y+b.size)return false;
 for(const f of (state.ecosystem?.farms||[]))if(xx>=f.x&&xx<f.x+(f.size||1)&&yy>=f.y&&yy<f.y+(f.size||1))return false;
 }return true}
function enterpriseLocation(n,size,kind){let best=null,score=-Infinity;for(let k=0;k<85;k++){
 const x=Math.round(n.x+(r()-.5)*30),y=Math.round(n.y+(r()-.5)*30);if(!enterpriseSiteFree(x,y,size))continue;
 const near=state.people.filter(p=>p.alive&&p.nation===n.id&&Math.hypot(p.x-x,p.y-y)<18).length;
 const competition=enterpriseState().sites.filter(b=>b.kind===kind&&Math.hypot(b.x-x,b.y-y)<12).length;
 const farms=kind==='bakery'?ensureEcosystem().farms.filter(f=>Math.hypot(f.x-x,f.y-y)<15).length:0;
 const scoreNow=near*4+farms*5-competition*20-Math.hypot(x-n.x,y-n.y)*.5+r()*2;
 if(scoreNow>score){score=scoreNow;best={x,y}}}return best}
function enterpriseCreate(n,owner,kind,publicOwned=false){const e=enterpriseState(),size=(kind==='bakery'||kind==='toolshop')?2:1,site=enterpriseLocation(n,size,kind);if(!site)return false;

 if((m.stock.stone||0)<stoneCost||(m.stock.wood||0)<woodCost)return false;
 const materials=stoneCost*Math.ceil(marketPrice(n,'stone')*1.25)+woodCost*Math.ceil(marketPrice(n,'wood')*1.25);
 const capital=(kind==='bakery'||kind==='toolshop')?50:0,buildBudget=(kind==='bakery'||kind==='toolshop')?80:25,total=materials+capital+buildBudget;
 if(publicOwned){if(n.treasury<total+100)return false;n.treasury-=total}else{if(!owner||owner.gold<total+15)return false;owner.gold-=total}
 m.stock.stone-=stoneCost;m.stock.wood-=woodCost;n.treasury+=materials;
 e.sites.push({id:e.nextId++,kind,nation:n.id,owner:publicOwned?null:owner.id,publicOwned,x:site.x,y:site.y,size,progress:0,capital,buildBudget,buildPaid:0,workers:{},stockWheat:0,stockBread:0,wheatCost:0,stockTools:0,toolCost:0,earnings:0,revenue:0,expenses:0,taxesPaid:0,materialsPaid:materials,ownerContributions:capital+buildBudget,customers:0,lastUsed:state.t,created:state.t});
 log((publicOwned?n.name:fullName(owner))+' funded a '+kind+' construction site.');return true}
function enterpriseBuildTick(){if(state.t%5!==0)return;for(const b of enterpriseState().sites){if(b.progress>=100)continue;
 const workers=state.people.filter(p=>p.alive&&p.age>=3&&p.nation===b.nation&&p.hunger>45&&p.thirst>40&&p.energy>25&&(!p.fieldWork));
 workers.sort((a,c)=>Math.hypot(a.x-b.x,a.y-b.y)-Math.hypot(c.x-b.x,c.y-b.y));const p=workers[0];if(!p)continue;
 if(Math.hypot(p.x-b.x,p.y-b.y)>2.8){if(Math.hypot(p.x-b.x,p.y-b.y)<30)walkTo(p,(x,y)=>Math.hypot(x-b.x,y-b.y)<2.5,36);continue}
 const skill=p.skills?.Building||0,old=b.progress;b.progress=Math.min(100,b.progress+.4+skill*.16);p.energy=Math.max(0,p.energy-.6);p.plan='Paid builder: '+b.kind+' '+Math.floor(b.progress)+'%';learn(p,'Building',.08,'Paid construction');
 const milestones=Math.floor(b.progress/10)-Math.floor(old/10);if(milestones>0){const pay=milestones*b.buildBudget/10;p.gold=(p.gold||0)+pay;b.buildPaid+=pay;b.expenses=(b.expenses||0)+pay;b.workers[p.id]=(b.workers[p.id]||0)+pay}

else if(tab==='news'){const news=ensureCommunication();el.innerHTML=`<h2>📰 Village News</h2><div class="panel"><p class="notice">Recorded events from the simulation. Disputes, decisions, discoveries and daily life appear here. News is factual; message-board posts reflect personal views.</p><div class="grid">${[['Events',news?state.news.length:0],['Disputes',state.people.reduce((n,q)=>n+(q.social?.disputes||0),0)/2],['Board posts',news.posts.length],['Board reads',news.reads]].map(([k,v])=>`<div class="stat"><small>${k}</small><strong>${Math.floor(v)}</strong></div>`).join('')}</div></div>${state.news.slice(0,100).map(n=>`<div class="panel"><small>${esc(n.category)} · Year ${n.year}, Day ${n.day}</small><div class="event">${esc(n.msg)}</div></div>`).join('')||'<p>No recorded news yet.</p>'}`}

ader.alive?'Elected leader: <strong>'+esc(fullName(leader))+'</strong>':'No recognized community figure yet'}</p><p class="notice">Adults elect a leader based on trust and social standing. Leaders represent the community; they do not directly control villagers.</p>${top.map(v=>`<div class="row event"><button data-person="${v.q.id}">${esc(fullName(v.q))}</button><small>Standing ${v.score}</small></div>`).join('')}</div><div class="panel"><h3>Recent trades</h3>${c.tradeLog.slice(0,12).map(v=>`<div class="event">${esc(fullName(person(v.a)||{name:'Unknown',surname:''}))} ↔ ${esc(fullName(person(v.b)||{name:'Unknown',surname:''}))} · ${esc(v.detail)}<br><small>Year ${v.year}, day ${v.day}</small></div>`).join('')||'<small>No face-to-face barter yet.</small>'}</div><div class="panel"><h3>Generations</h3>${state.history.slice(-12).map(v=>`<div class="event">Year ${v.year} · ${v.pop} living · ${v.births??'—'} births (cumulative) · ${v.deaths??'—'} deaths (cumulative)</div>`).join('')||'<small>The first annual snapshot appears after year 1.</small>'}</div>`}
else if(tab==='ecosystem'){const e=ensureEcosystem(),rabbits=e.animals.filter(a=>a.kind==='rabbit').length,deer=e.animals.length-rabbits,stored=(state.stores||[]).reduce((n,b)=>n+b.food,0);el.innerHTML=`<h2>🦌 Living Ecosystem</h2><div class="grid">${[['Rabbits',rabbits],['Deer',deer],['Farm plots (2×2)',e.farms.filter(f=>f.size===2).length],['Fish caught',ensureInfrastructure().fishCaught],['Bridges',ensureInfrastructure().bridges.length],['Bridge projects',bridgeProjects().projects.filter(j=>!j.done).length],['Crossing requests',Object.values(bridgeProjects().demands).reduce((s,d)=>s+d.votes,0)],['Public stores',(state.stores||[]).filter(b=>b.access!=='private').length],['Private stores',(state.stores||[]).filter(b=>b.access==='private').length],['Hunts',e.hunts],['Crops harvested',e.harvests],['Stored food',stored],['Fields created',e.planted],['Fields watered',e.waterings],['Fields under construction',e.farms.filter(f=>f.building).length],['Dry field-days',e.dryDays],['Upgraded homes',buildings.filter(b=>(b.level||1)>1).length],['Food banked',e.foodStored]].map(([k,v])=>`<div class="stat"><small>${k}</small><strong>${v}</strong></div>`).join('')}</div><div class="panel"><h3>Seasonal survival</h3><p>Spring and summer favor crop growth. Winter stops harvests and challenges wildlife. Experienced foragers may hunt animals and begin farming. Farms produce food over time; villagers must reach them to harvest.</p><p class="notice">Wildlife movement and reproduction are simplified. Farming requires Foraging skill level 5. Fields are placed outside town centers, require one full day of work and 15 energy to establish, and need water in summer. Watering costs 3 energy and harvesting costs 5. Hunting requires level 3. Fields abandoned for a full year without harvesting disappear. Stone axes, pickaxes and hoes can be crafted after discovering Stone Tools; they increase efficiency but wear out. Nearby villagers can contribute materials to family home upgrades. Food stores can function exportWorldMap(){const tile=4,c=document.createElement('canvas');c.width=N*tile;c.height=N*tile;const g=c.getContext('2d');g.imageSmoothingEnabled=false;for(let y=0;y<N;y++)for(let x=0;x<N;x++){const k=idx(x,y);g.fillStyle=terrain[k]?'#3379a0':trees[k]?'#376c3b':height[k]>=6?'#86965d':'#719657';g.fillRect(x*tile,y*tile,tile,tile);if(!terrain[k]&&(ensureCivilization().traffic[k]||0)>=6){g.fillStyle='#b39b76';g.fillRect(x*tile+1,y*tile+1,2,2)}}for(const n of nations()){for(const m of marketLocations(n)){g.fillStyle=n.color;g.fillRect((m.x-1)*tile,(m.y-1)*tile,3*tile,3*tile)}for(const road of n.roadProjects||[]){if(road.progress>=100){g.fillStyle='#9b9d9f';g.fillRect(road.x*tile,road.y*tile,tile,tile)}}}for(const b of buildings){g.fillStyle='#c8b48a';g.fillRect((b.x-1)*tile,(b.y-1)*tile,2*tile,2*tile)}for(const b of enterpriseState().sites){g.fillStyle=b.kind==='bakery'?'#e8a354':b.kind==='well'?'#7fd2e8':'#d6a57a';g.fillRect(b.x*tile,b.y*tile,(b.kind==='bakery'?2:1)*tile,(b.kind==='bakery'?2:1)*tile)}for(const p of state.people){if(!p.alive)continue;g.fillStyle=nations()[p.nation]?.color||'#fff';g.fillRect(Math.floor(p.x)*tile,Math.floor(p.y)*tile,tile,tile)}const a=document.createElement('a');a.download='ai-village-world-year-'+state.year+'.png';a.href=c.toDataURL('image/png');a.click()}
function showNewWorldSetup(){const old=document.getElementById('newWorldSetup');if(old)old.remove();const d=document.createElement('div');d.id='newWorldSetup';d.style.cssText='position:fixed;z-index:100000;inset:0;background:#101a16eF;display:flex;align-items:center;justify-content:center;padding:18px';d.innerHTML='<div style="background:#22352a;color:#fff;padding:22px;border-radius:16px;width:min(430px,100%);font:16px system-ui"><h2>🌍 New World Settings</h2><label>Nations (1–4)<input id="wsN" type="number" min="1" max="4" value="2" style="display:block;width:100%;padding:10px;margin:8px 0 16px"></label><label>Citizens per nation (5–30)<input id="wsC" type="number" min="5" max="30" value="12" style="display:block;width:100%;padding:10px;margin:8px 0 16px"></label><label>Starting items per market (0–100)<input id="wsS" type="number" min="0" max="100" value="10" style="display:block;width:100%;padding:10px;margin:8px 0 16px"></label><button id="wsStart">Generate new world</button> <button id="wsCancel">Cancel</button><p style="font-size:12px">Your current world will be replaced. Export a backup first.</p></div>';document.body.appendChild(d);d.querySelector('#wsN').value=worldSettings.nations;d.querySelector('#wsC').value=worldSettings.citizens;d.querySelector('#wsS').value=worldSettings.stock;d.querySelector('#wsCancel').onclick=()=>d.remove();d.querySelector('#wsStart').onclick=async()=>{if(!confirm('Replace the current world? Make sure you exported your save.'))return;const val=(id,min,max)=>Math.max(min,Math.min(max,Number(d.querySelector(id).value)||min));worldSettings={nations:val('#wsN',1,4),citizens:val('#wsC',5,30),stock:val('#wsS',0,100)};buildings=[];cam={x:58,y:63,scale:19};init();ensureEcosystem();selected=0;existingWorld=true;d.remove();await save();render()}}
function serialize(){return{state,terrain:Array.from(terrain),stoneNodes:Array.from(stoneNodes),metalDeposits,wildPlants,fruitTrees,trees:Array.from(trees),berries:Array.from(berries),height:Array.from(height),buildings,cam}}
// Compact, lossless byte-array storage. Legacy saves remain readable.
function packBytes(arr){let out='';const chunk=8192;for(let i=0;i<arr.length;i+=chunk)out+=String.fromCharCode(...arr.subarray(i,i+chunk));return btoa(out)}
function unpackBytes(value){if(Array.isArray(value))return Uint8Array.from(value);if(typeof value!=='string')throw Error('Invalid saved map');const raw=atob(value),out=new Uint8Array(raw.length);for(let i=0;i<raw.length;i++)out[i]=raw.charCodeAt(i);return out}
function compactSave(){const s=serialize();for(const key of ['terrain','stoneNodes','trees','berries','height'])s[key]=packBytes(new Uint8Array(s[key]));s.saveFormat='compact-v1';return JSON.stringify(s)}

function openSaveDB(){return new Promise((resolve,reject)=>{const request=indexedDB.open('AI_Village_Saves',1);request.onupgradeneeded=()=>request.result.createObjectStore('games');request.onsuccess=()=>resolve(request.result);request.onerror=()=>reject(request.error)})}
async function idbWrite(payload){const db=await openSaveDB();try{await new Promise((resolve,reject)=>{const tx=db.transaction('games','readwrite');tx.objectStore('games').put(payload,'current');tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error);tx.onabort=()=>reject(tx.error)})}finally{db.close()}}
async function idbRead(){const db=await openSaveDB();try{return await new Promise((resolve,reject)=>{const tx=db.transaction('games','readonly');const req=tx.objectStore('games').get('current');req.onsuccess=()=>resolve(req.result||null);req.onerror=()=>reject(req.error)})}finally{db.close()}}
async function save(){if(saveBusy)return false;saveBusy=true;try{
 const payload=compactSave();await idbWrite(payload);
 try{localStorage.setItem('aiVillageV32LastActive',String(Date.now()))}catch(_){}
 saveWarningShown=false;return true;
 }catch(e){if(!saveWarningShown){saveWarningShown=true;alert('Save failed: '+String(e?.message||e)+'. Export a backup from World. Do not clear browser data.')}return false}finally{saveBusy=false}}
function load(savedPayload){try{let s=JSON.parse(savedPayload||localStorage.getItem('aiVillageV32Nations')||localStorage.getItem('aiVillageV31Nations')||localStorage.getItem('aiVillageV3Nations'));if(!s||!s.state||unpackBytes(s.terrain).length!==N*N)return false;state=s.state;worldSeed=state.worldSeed||42517;r=rand(worldSeed+state.t+1);state.people.forEach((p,i)=>{if(!p.surname)p.surname=surnames[i%12];if(!p.sex)p.sex=i%2===0?'F':'M';if(p.partnerId===undefined)p.partnerId=null;if(p.motherId===undefined)p.motherId=null;if(p.fatherId===undefined)p.fatherId=null;if(p.lastChildYear===undefined)p.lastChildYear=-100;if(p.birthYear===undefined)p.birthYear=1;if(!p.birthSurname)p.birthSurname=p.surname;if(p.surnameChanges===undefined)p.surnameChanges=0});terrain=unpackBytes(s.terrain);if(s.stoneNodes&&unpackBytes(s.stoneNodes).length===N*N)stoneNodes=unpackBytes(s.stoneNodes);else generateStone();trees=unpackBytes(s.trees);berries=unpackBytes(s.berries);height=unpackBytes(s.height);buildings=s.buildings||[];if(Array.isArray(s.metalDeposits))metalDeposits=s.metalDeposits;if(Array.isArray(s.wildPlants))wildPlants=s.wildPlants;if(Array.isArray(s.fruitTrees))fruitTrees=s.fruitTrees;if(!s.metalDeposits||!s.wildPlants||!s.metalDeposits.every(d=>Array.isArray(d.tiles))){generateResources()}else if(!s.fruitTrees){const rr=rand(worldSeed^0xA881);fruitTrees=[];for(let y=2;y<N-2;y++)for(let x=2;x<N-2;x++)if(trees[idx(x,y)]&&rr()<.075)fruitTrees.push({x,y,apples:4})}cam=s.cam||cam;nations();for(const p of state.people){if(p.nation===undefined)p.nation=Math.hypot(p.x-58,p.y-63)<Math.hypot(p.x-248,p.y-248)?0:1;if(p.gold===undefined)p.gold=p.age>=3?250:0}return true}catch(e){return false}}
document.getElementById('content').addEventListener('click',e=>{const b=e.target.closest('button[data-house-deposit],button[data-house-withdraw]');if(!b)return;const p=person(selected),home=p&&homeBuilding(p);if(!home)return;const key=b.dataset.houseDeposit||b.dataset.houseWithdraw;const ok=b.hasAttribute('data-house-deposit')?houseDeposit(p,home,key):houseWithdraw(p,home,key);if(ok){dirty=true;render()}});
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});document.getElementById('pause').onclick=()=>{paused=!paused;document.getElementById('pause').textContent=paused?'▶ Resume':'⏸ Pause'};document.getElementById('speed').onchange=e=>speed=+e.target.value;document.getElementById('save').onclick=async()=>{if(await save())alert('Saved on this device.')};document.getElementById('newWorld').onclick=()=>{if(!confirm('Generate a completely new random world? Your current village will be replaced. Export a save first if you want to keep it.'))return;localStorage.removeItem('aiVillageV3Nations');buildings=[];cam={x:58,y:63,scale:19};selected=0;paused=false;init();ensureEcosystem();save();render()};document.getElementById('god').onclick=e=>{god=!god;e.target.classList.toggle('active',god);tab='world';render()};
function pointer(e){let rect=canvas.getBoundingClientRect();return{x:e.clientX-rect.left,y:e.clientY-rect.top}}
let pointers=new Map(),pinch=null;
canvas.addEventListener('pointerdown',e=>{canvas.setPointerCapture(e.pointerId);pointers.set(e.pointerId,pointer(e));if(pointers.size===1){drag={start:pointer(e),camx:cam.x,camy:cam.y,moved:false}}else if(pointers.size===2){let [a,b]=[...pointers.values()];pinch={dist:Math.hypot(a.x-b.x,a.y-b.y),scale:cam.scale};drag=null}});
canvas.addEventListener('pointermove',e=>{if(!pointers.has(e.pointerId))return;pointers.set(e.pointerId,pointer(e));if(pointers.size===2&&pinch){let [a,b]=[...pointers.values()];cam.scale=Math.max(6,Math.min(48,pinch.scale*Math.hypot(a.x-b.x,a.y-b.y)/Math.max(1,pinch.dist)))}else if(drag&&pointers.size===1){let q=pointer(e),dx=q.x-drag.start.x,dy=q.y-drag.start.y;if(Math.abs(dx)+Math.abs(dy)>7)drag.moved=true;cam.x=Math.max(0,Math.min(N,drag.camx-dx/cam.scale));cam.y=Math.max(0,Math.min(N,drag.camy-dy/cam.scale))}});
canvas.addEventListener('pointerup',e=>{let q=pointer(e);if(drag&&!drag.moved){let wx=cam.x+(q.x-vp.clientWidth/2)/cam.scale,wy=cam.y+(q.y-vp.clientHeight/2)/cam.scale;let nearest=state.people.filter(p=>p.alive).sort((a,b)=>Math.hypot(a.x-wx,a.y-wy)-Math.hypot(b.x-wx,b.y-wy))[0];if(nearest&&Math.hypot(nearest.x-wx,nearest.y-wy)<.72)selectPerson(nearest.id);else{const hit=buildingAt(wx,wy);if(hit)selectBuilding(hit);else if(nearest&&Math.hypot(nearest.x-wx,nearest.y-wy)<1.8)selectPerson(nearest.id)}}pointers.delete(e.pointerId);if(pointers.size<2)pinch=null;drag=null});
canvas.addEventListener('pointercancel',e=>{pointers.delete(e.pointerId);drag=null;pinch=null});
canvas.addEventListener('wheel',e=>{e.preventDefault();cam.scale=Math.max(6,Math.min(48,cam.scale*(e.deltaY>0?.9:1.1)))},{passive:false});
let existingWorld=false,gameReady=false;
async function bootGame(){let saved=null;try{saved=await idbRead()}catch(e){console.warn('IndexedDB unavailable',e)}existingWorld=load(saved);if(!existingWorld)init();else if(state.worldSettings)worldSettings={...worldSettings,...state.worldSettings};nations();if(!state.techStats)state.techStats={extraFood:0,extraWood:0,waterIllness:0};state.people.forEach(p=>{ensureLearning(p);ensureMind(p);ensureKnowledge(p);ensureInventory(p);ensureRoutine(p)});ensureProduction();ensureTransport();ensureEcosystem();if(!state.workshops)state.workshops=[];ensureCommunication();ensureBoats();repairPartnerships();if(!Number.isFinite(state.distanceWalked))state.distanceWalked=0;render();gameReady=true;setInterval(()=>save(),30000);document.addEventListener('visibilitychange',()=>{if(document.hidden&&!offlineRunning)save()});setTimeout(offlineCatchup,100);}
bootGame().catch(e=>showSimulationError(e));

const APP_VERSION='3.7.0';
function versionParts(v){return String(v).replace(/^v/,'').split('.').map(x=>parseInt(x,10)||0)}
function newerVersion(a,b){const aa=versionParts(a),bb=versionParts(b);for(let i=0;i<3;i++){if((aa[i]||0)!==(bb[i]||0))return (aa[i]||0)>(bb[i]||0)}return false}
async function checkForUpdate(manual=false){if(!/^https?:$/.test(location.protocol)){if(manual)alert('Update checks require GitHub Pages.');return}const b=document.getElementById('checkUpdates');if(manual&&b){b.disabled=true;b.textContent='🔄 Checking…'}try{const res=await fetch('./version.json?check='+Date.now(),{cache:'no-store'});if(!res.ok)throw new Error('version.json unavailable');const info=await res.json();if(!info||typeof info.version!=='string')throw new Error('Invalid version.json');if(!newerVersion(info.version,APP_VERSION)){if(manual)alert('You are up to date: v'+APP_VERSION);return}const notice=document.getElementById('updateNotice');document.getElementById('updateMessage').textContent='AI Village v'+info.version+' is available. '+(info.notes||'Save and refresh to update.');notice.style.display='block';document.getElementById('updateNow').onclick=async()=>{if(!await save()){document.getElementById('updateStatus').textContent='Save failed; update cancelled.';return}location.reload()};document.getElementById('updateLater').onclick=()=>{notice.style.display='none'}}catch(e){if(manual)alert('Update check failed: '+e.message)}finally{if(b){b.disabled=false;b.textContent='🔄 Check updates'}}}
document.getElementById('checkUpdates').onclick=()=>checkForUpdate(true);
setTimeout(checkForUpdate,2500);setInterval(checkForUpdate,5*60*1000);

let offlineRunning=false;
function offlineCatchup(){
 if(!existingWorld){try{localStorage.setItem('aiVillageV32LastActive',String(Date.now()))}catch(_){}return}
 let then=Number(localStorage.getItem('aiVillageV32LastActive'));
 if(!Number.isFinite(then)||then<=0){save();return}
 const away=Math.max(0,Math.min(8*3600000,Date.now()-then));
 const total=Math.floor(away/2000); // Exactly 1x: one simulation tick per two real seconds.
 if(total<30)return;
 offlineRunning=true;
 const startYear=state.year,startDay=state.day,startPopulation=state.people.filter(p=>p.alive).length;
 const startBirths=state.births||0,startDeaths=state.deaths||0,startStructures=state.structures||0;
 const oldPaused=paused;paused=true;
 const panel=document.createElement('div');panel.id='offlineProgress';panel.style.cssText='position:fixed;inset:0;z-index:99999;background:#101d19ee;display:flex;align-items:center;justify-content:center;padding:20px;color:#fff;font-family:system-ui';
 panel.innerHTML='<div style="background:#20372e;border:1px solid #587d67;border-radius:14px;padding:22px;width:min(420px,100%);text-align:center"><h2>⏳ Offline Progress</h2><p id="offlineInfo">Simulating your village at 1× speed…</p><progress id="offlineBar" max="100" value="0" style="width:100%"></progress><p><button id="offlineSkip" style="padding:10px 18px">Stop catch-up</button></p></div>';
 document.body.appendChild(panel);
 let done=0,stop=false,failed=null;
 panel.querySelector('#offlineSkip').onclick=()=>{stop=true};
 const finish=()=>{
  offlineRunning=false;paused=oldPaused;acc=0;last=performance.now();
  save();panel.remove();dirty=true;
  const births=(state.births||0)-startBirths,deaths=(state.deaths||0)-startDeaths,structures=(state.structures||0)-startStructures;
  const elapsedDays=Math.floor(done/60);
  const message=failed?'Offline simulation stopped because of an error. Your progress was saved.\n'+String(failed.stack||failed):
   'While you were away ('+elapsedDays+' game days at 1×):\n'+
   'Births: '+births+' · Deaths: '+deaths+'\n'+
   'New shelters: '+structures+' · Population: '+startPopulation+' → '+state.people.filter(p=>p.alive).length+'\n'+
   'Current date: Year '+state.year+', Day '+state.day+(stop?'\nCatch-up stopped early.':'');
  alert(message);
 };
 const step=()=>{
  const deadline=performance.now()+12;
  try{while(done<total&&!stop&&performance.now()<deadline){tick();done++}}
  catch(e){failed=e;stop=true}
  panel.querySelector('#offlineBar').value=Math.round(done/total*100);
  panel.querySelector('#offlineInfo').textContent='Simulated '+Math.floor(done/60)+' of '+Math.floor(total/60)+' game days ('+Math.round(done/total*100)+'%)';
  if(done>=total||stop)finish();else setTimeout(step,0);
 };
 setTimeout(step,30);
}
let simulationError=null;
function showSimulationError(err){if(simulationError)return;simulationError=err;paused=true;const info='AI Village v'+APP_VERSION+' | Year '+state.year+', Day '+state.day+', Tick '+state.t+' | '+String(err&&err.stack||err);try{localStorage.setItem('aiVillageV3LastError',info)}catch(_){}const panel=document.createElement('div');panel.id='simulationErrorPanel';panel.style.cssText='position:fixed;z-index:999999;left:8px;right:8px;top:8px;background:#401c22;color:white;border:2px solid #ff9b9b;padding:14px;border-radius:12px;max-height:55vh;overflow:auto;font:14px system-ui';const heading=document.createElement('strong');heading.textContent='Simulation error detected — your save has not been deleted';panel.appendChild(heading);const pre=document.createElement('pre');pre.style.cssText='white-space:pre-wrap;overflow-wrap:anywhere;font-size:11px';pre.textContent=info;panel.appendChild(pre);const copy=document.createElement('button');copy.textContent='Copy error details';copy.onclick=()=>{if(navigator.clipboard?.writeText)navigator.clipboard.writeText(info);else prompt('Copy this error:',info)};panel.appendChild(copy);const close=document.createElement('button');close.textContent='Close';close.style.marginLeft='12px';close.onclick=()=>panel.remove();panel.appendChild(close);document.body.appendChild(panel)}
window.addEventListener('error',e=>{if(!simulationError)showSimulationError(e.error||new Error(e.message))});
function loop(now){try{if(!gameReady){last=now;requestAnimationFrame(loop);return}let dt=Math.min(.15,(now-last)/1000);last=now;if(!paused&&!offlineRunning){acc+=dt*speed;let ticks=0;while(acc>=2&&acc<100&&ticks++<6){tick();acc-=2}}draw();uiTimer+=dt;if(uiTimer>.6){uiTimer=0;if(dirty){render();dirty=false}}}catch(err){showSimulationError(err)}requestAnimationFrame(loop)}requestAnimationFrame(loop);
})();
</script></body></html>
