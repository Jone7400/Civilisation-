(()=>{'use strict';
const N=314,DAY=60,YEAR=120,KEY='aiVillageV3',COLORS=['#63a8ee','#ed776d'],NAMES=['Anna','Erik','Mia','Oscar','Sofie','Lars','Emma','Noah','Freja','Oliver','Ida','Lucas'],SURNAMES=['Ashwood','Riverbend','Oakheart','Stonefield','Willowmere','Northbrook','Fernholm','Brightwater','Thornhill','Meadowcroft','Redleaf','Ironwood'];
const ITEMS=['food','wood','stone','iron','basket'],BASE={food:5,wood:8,stone:12,iron:28,basket:48},WEIGHT={food:1,wood:2,stone:3,iron:3,basket:2};
let seed=1,random=Math.random,state,terrain,trees,berries,stone,iron,roads,buildings=[],cam={x:157,y:157,scale:7},selected=null,tab='economy',paused=false,speed=1,acc=0,last=performance.now(),uiElapsed=0,drag=null,frame=0;
const canvas=document.getElementById('world'),ctx=canvas.getContext('2d'),vp=document.getElementById('viewport');
function rng(s){return()=>{s|=0;s=s+0x6d2b79f5|0;let t=Math.imul(s^s>>>15,1|s);t^=t+Math.imul(t^t>>>7,61|t);return((t^t>>>14)>>>0)/4294967296}}
function ix(x,y){return y*N+x}function inside(x,y){return x>=0&&y>=0&&x<N&&y<N}function land(x,y){return inside(x,y)&&terrain[ix(x,y)]===0}function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}function fmt(n){return Math.round(n).toLocaleString('en-US')}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function village(id){return state.villages[id]}
function generate(){const r=rng(seed);terrain=new Uint8Array(N*N);trees=new Uint8Array(N*N);berries=new Uint8Array(N*N);stone=new Uint8Array(N*N);iron=new Uint8Array(N*N);roads=new Uint8Array(N*N);for(let y=0;y<N;y++)for(let x=0;x<N;x++){const i=ix(x,y),w=Math.sin(x*.044+seed*.001)+Math.cos(y*.055-seed*.0003)+Math.sin((x+y)*.024);terrain[i]=(w<-.98||r()<.004)?1:0;trees[i]=!terrain[i]&&r()<.31?1:0;berries[i]=trees[i]&&r()<.21?1:0;stone[i]=!terrain[i]&&r()<.075?1+Math.floor(r()*3):0;iron[i]=!terrain[i]&&r()<.017?1+Math.floor(r()*2):0}for(let y=0;y<N;y++)for(let x=0;x<N;x++)if(Math.abs(x-73)<17&&Math.abs(y-88)<17||Math.abs(x-243)<17&&Math.abs(y-228)<17){let i=ix(x,y);terrain[i]=0;trees[i]=0;berries[i]=0}for(let a=0;a<2;a++){let c=a?{x:243,y:228}:{x:73,y:88};for(let j=0;j<45;j++){let x=c.x+Math.floor((r()-.5)*37),y=c.y+Math.floor((r()-.5)*37);if(land(x,y)&&!trees[ix(x,y)])berries[ix(x,y)]=1}}}
function addNews(msg,vid=null,kind='event'){state.news.unshift({msg,vid,kind,year:state.year,day:state.day});state.news.length=Math.min(180,state.news.length)}
function homeOf(p){return buildings.find(b=>b.type==='house'&&b.owner===p.id)}
function start(){seed=(Math.random()*2147483647)|0;random=rng(seed);generate();buildings=[];state={seed,year:1,day:1,t:0,villages:[{id:0,name:'Blue Village',x:73,y:88,gold:50000,mayor:0,term:1,market:{stock:{food:130,wood:85,stone:55,iron:12,basket:5},avg:{...BASE},demand:{food:0,wood:0,stone:0,iron:0,basket:0}},jobs:[],completed:0,taxes:0,profits:0,wages:0},{id:1,name:'Red Village',x:243,y:228,gold:50000,mayor:12,term:1,market:{stock:{food:130,wood:85,stone:55,iron:12,basket:5},avg:{...BASE},demand:{food:0,wood:0,stone:0,iron:0,basket:0}},jobs:[],completed:0,taxes:0,profits:0,wages:0}],people:[],news:[],history:[],trades:0,barters:0,ironMined:0};
for(let v=0;v<2;v++){const c=village(v);buildings.push({type:'market',x:c.x,y:c.y,village:v});for(let j=0;j<12;j++){const id=v*12+j,angle=j*Math.PI/6,px=c.x+Math.round(Math.cos(angle)*(7+j%3)),py=c.y+Math.round(Math.sin(angle)*(7+j%3));buildings.push({type:'house',x:px,y:py,village:v,level:1,owner:id});state.people.push({id,name:NAMES[j],surname:SURNAMES[(j+v*5)%12],village:v,x:px,y:py,age:18+Math.floor(random()*27),gold:250,food:3,wood:0,stone:0,iron:0,basket:0,energy:75+random()*25,hunger:75+random()*25,skill:{farming:1+random()*4,fishing:1+random()*4,mining:1+random()*4,building:1+random()*4},goal:'Explore',occupation:'Forager',alive:true,home:true,thought:'I need to earn a living.',target:null,work:null,experience:{},taxPaid:0,earnings:0,spent:0});}addNews(c.name+' founded with 50,000 gold in the treasury.',v,'founding')}
cam={x:73,y:88,scale:8};selected=null;tab='economy';save();render()}
function price(v,item){const m=v.market,stock=m.stock[item]||0,ideal={food:110,wood:75,stone:45,iron:20,basket:8}[item],demand=m.demand[item]||0;return Math.max(1,Math.round(BASE[item]*Math.max(.35,Math.min(3.5,1+(ideal-stock)/Math.max(10,ideal)*.7+demand*.035))))}
function capacity(p){return 16+(p.basket?12:0)}function load(p){return ITEMS.reduce((n,k)=>n+(p[k]||0)*WEIGHT[k],0)}
function marketTrade(p,item,qty,mode){const v=village(p.village),m=v.market;if(dist(p,v)>3)return false;let n=0;for(let j=0;j<qty;j++){const buy=price(v,item),sell=Math.ceil(buy*1.25);if(mode==='sell'){if(!(p[item]>0)||v.gold<buy)break;p[item]--;m.stock[item]++;v.gold-=buy;p.gold+=buy;p.earnings+=buy;n++;m.demand[item]=Math.max(-20,(m.demand[item]||0)-.25)}else{if(m.stock[item]<=0||p.gold<sell||load(p)+WEIGHT[item]>capacity(p))break;p[item]++;m.stock[item]--;v.gold+=sell;p.gold-=sell;p.spent+=sell;v.profits+=sell-buy;n++;m.demand[item]=Math.min(20,(m.demand[item]||0)+.25)}}if(n){state.trades+=n;p.thought=mode==='sell'?`I sold ${n} ${item} at the market.`:`I bought ${n} ${item} from the market.`;return true}return false}
function chooseTask(p){const v=village(p.village),m=v.market;let choices=['food','wood','stone','iron'];choices.sort((a,b)=>{let sa=price(v,a)/(a==='iron'?3:a==='stone'?2:1.2)*(1+(p.skill[a==='food'?'farming':a==='wood'?'building':'mining']||1)*.04),sb=price(v,b)/(b==='iron'?3:b==='stone'?2:1.2)*(1+(p.skill[b==='food'?'farming':b==='wood'?'building':'mining']||1)*.04);return sb-sa});p.occupation={food:'Forager / Fisher',wood:'Forester',stone:'Stone Miner',iron:'Iron Miner'}[choices[0]];return choices[0]}
function move(p,x,y){const dx=x-p.x,dy=y-p.y;if(Math.abs(dx)+Math.abs(dy)<1)return true;const opts=[{x:p.x+Math.sign(dx),y:p.y},{x:p.x,y:p.y+Math.sign(dy)}].filter(q=>land(q.x,q.y));if(!opts.length)return false;opts.sort((a,b)=>Math.hypot(x-a.x,y-a.y)-Math.hypot(x-b.x,y-b.y));let q=opts[0],road=roads[ix(q.x,q.y)]>0;p.x=q.x;p.y=q.y;p.energy=Math.max(0,p.energy-(road?.07:.28));return Math.abs(p.x-x)+Math.abs(p.y-y)<1}
function nearest(p,fn,radius=26){let best=null,score=Infinity;for(let y=Math.max(0,p.y-radius);y<=Math.min(N-1,p.y+radius);y++)for(let x=Math.max(0,p.x-radius);x<=Math.min(N-1,p.x+radius);x++){const d=Math.abs(x-p.x)+Math.abs(y-p.y);if(d<score&&fn(x,y)){score=d;best={x,y}}}return best}
function gather(p,item){if(load(p)+WEIGHT[item]>capacity(p))return false;let fn=item==='food'?(x,y)=>berries[ix(x,y)]>0:item==='wood'?(x,y)=>trees[ix(x,y)]>0:item==='stone'?(x,y)=>stone[ix(x,y)]>0:(x,y)=>iron[ix(x,y)]>0;let q=nearest(p,fn,item==='iron'?34:22);if(!q)return false;if(p.x!==q.x||p.y!==q.y){move(p,q.x,q.y);p.goal='Travel to '+item;return true}let i=ix(p.x,p.y);if(item==='food'){berries[i]=0;p.food+=2;p.skill.farming+=.03}else if(item==='wood'){trees[i]=0;p.wood++;p.skill.building+=.02}else if(item==='stone'){stone[i]--;p.stone++;p.skill.mining+=.03}else{iron[i]--;p.iron++;state.ironMined++;p.skill.mining+=.05}p.energy=Math.max(0,p.energy-2.5);p.goal='Gather '+item;return true}
function jobWork(p){const v=village(p.village),job=v.jobs.find(j=>j.status==='open'&&(!j.worker||j.worker===p.id));if(!job||p.gold>500&&random()<.6)return false;if(!job.worker){job.worker=p.id;p.work=job.id;p.thought=`I accepted a paid ${job.type} job.`}if(dist(p,job)>1){move(p,job.x,job.y);p.goal='Travel to public job';return true}if(p.energy<25)return false;job.progress++;p.energy-=1.5;p.goal='Work on '+job.type;if(job.progress>=job.required){job.status='done';let cost=Math.min(job.wage,v.gold);v.gold-=cost;p.gold+=cost;p.earnings+=cost;v.wages+=cost;v.completed++;let b={type:job.type,x:job.x,y:job.y,village:p.village};if(job.type==='road'){for(let y=job.y-4;y<=job.y+4;y++)for(let x=job.x-4;x<=job.x+4;x++)if(land(x,y)&&Math.abs(x-job.x)+Math.abs(y-job.y)<=5)roads[ix(x,y)]=2}else buildings.push(b);addNews(`${p.name} completed ${job.type} for ${cost} gold.`,p.village,'project');p.work=null}return true}
function ai(p){if(!p.alive)return;const v=village(p.village);if(p.hunger<27){if(p.food>0){p.food--;p.hunger=Math.min(100,p.hunger+60);p.goal='Eat';return}if(dist(p,v)>2){move(p,v.x,v.y);p.goal='Find food';return}if(marketTrade(p,'food',2,'buy'))return;if(gather(p,'food'))return}if(p.energy<22){p.energy=Math.min(100,p.energy+4);p.goal='Rest';return}if(state.t%180===p.id%180&&buildings.some(b=>b.type==='school'&&b.village===p.village&&dist(b,p)<12)){p.skill.farming+=.08;p.skill.building+=.08;p.skill.mining+=.08;p.thought='I learned new techniques at the school.'}if(p.food<2&&p.gold>20){if(dist(p,v)>2){move(p,v.x,v.y);p.goal='Go shopping';return}marketTrade(p,'food',3,'buy');return}if(p.work&&v.jobs.some(j=>j.id===p.work&&j.status==='open')){if(jobWork(p))return}if(state.t%30===p.id%30&&v.jobs.some(j=>j.status==='open')&&random()<.7){if(jobWork(p))return}let carry=load(p);if(carry>capacity(p)*.67||p.gold<40&&carry>2){if(dist(p,v)>2){move(p,v.x,v.y);p.goal='Bring goods to market';return}let goods=['iron','stone','wood','food','basket'].filter(k=>p[k]>0&&(k!=='food'||p.food>3));goods.sort((a,b)=>price(v,b)-price(v,a));if(goods.length&&marketTrade(p,goods[0],Math.max(1,p[goods[0]]-(goods[0]==='food'?3:0)),'sell'))return}if(p.gold>70&&!p.basket&&v.market.stock.basket>0&&load(p)<5){if(dist(p,v)>2){move(p,v.x,v.y);return}marketTrade(p,'basket',1,'buy');return}if(state.t%120===p.id%120||!p.task)p.task=chooseTask(p);if(!gather(p,p.task)){p.task='food';gather(p,'food')}if(p.energy<75&&random()<.05)p.energy=Math.min(100,p.energy+2)}
function daily(){state.day++;for(const p of state.people){if(!p.alive)continue;p.hunger=Math.max(0,p.hunger-6);p.energy=Math.min(100,p.energy+6);const h=homeOf(p);if(h){const tax=h.level;const paid=Math.min(p.gold,tax);p.gold-=paid;village(p.village).gold+=paid;village(p.village).taxes+=paid;p.taxPaid+=paid;if(paid<tax)p.thought='I cannot afford my property tax.'}if(p.hunger===0){p.energy-=10;if(p.energy<=0){p.alive=false;addNews(p.name+' died from starvation.',p.village,'death')}}}for(const v of state.villages){for(const k of ITEMS)v.market.demand[k]*=.93;if(state.day%10===0){const r=rng(seed+state.t+v.id);for(let n=0;n<12;n++){let x=v.x+Math.floor((r()-.5)*42),y=v.y+Math.floor((r()-.5)*42);if(land(x,y)){let i=ix(x,y);if(r()<.6)berries[i]=1;else if(!trees[i])trees[i]=1}}}if(v.jobs.filter(j=>j.status==='open').length<2&&v.gold>500){let priority=v.market.stock.food<70?'school':v.market.stock.wood<40?'road':['road','townhall','school','watchtower'][Math.floor(random()*4)];let x=v.x+Math.floor((random()-.5)*18),y=v.y+Math.floor((random()-.5)*18);if(land(x,y)&&!buildings.some(b=>Math.hypot(b.x-x,b.y-y)<3)){const cost={road:45,townhall:350,school:260,watchtower:210}[priority];v.jobs.push({id:state.t+v.id,type:priority,x,y,required:{road:12,townhall:38,school:28,watchtower:24}[priority],progress:0,wage:cost,worker:null,status:'open'});addNews(`${v.name} posted a ${priority} construction job for ${cost} gold.`,v.id,'job')}}}if(state.day>YEAR){state.day=1;state.year++;for(const v of state.villages){const candidates=state.people.filter(p=>p.alive&&p.village===v.id).sort((a,b)=>(b.gold+b.skill.building*30)-(a.gold+a.skill.building*30));if(candidates.length){v.mayor=candidates[Math.floor(random()*Math.min(3,candidates.length))].id;v.term=state.year;addNews(`${v.name} elected ${state.people[v.mayor].name} as mayor for Year ${state.year}.`,v.id,'election')}}state.history.push({year:state.year,gold:state.villages.map(v=>v.gold)});for(const p of state.people)if(p.alive)p.age++}if(state.day%20===0)save()}
function tick(){state.t++;for(const p of state.people)if(p.alive&&state.t%(p.id%3+2)===0)ai(p);if(state.t%DAY===0)daily();if(state.t%45===0){for(let n=0;n<3;n++){let a=state.people[Math.floor(random()*state.people.length)],b=state.people[Math.floor(random()*state.people.length)];if(a&&b&&a!==b&&a.alive&&b.alive&&a.village===b.village&&dist(a,b)<4&&a.food>4&&b.food<2){a.food--;b.food++;state.barters++;a.thought='I traded food directly with a neighbor.'}}}}
function draw(){const dpr=Math.min(devicePixelRatio||1,2),w=vp.clientWidth,h=vp.clientHeight;if(!w||!h)return;if(canvas.width!==Math.round(w*dpr)||canvas.height!==Math.round(h*dpr)){canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr)}ctx.setTransform(dpr,0,0,dpr,0,0);ctx.imageSmoothingEnabled=false;ctx.fillStyle='#1c3326';ctx.fillRect(0,0,w,h);let s=cam.scale,x0=cam.x-w/(2*s),y0=cam.y-h/(2*s),minx=Math.max(0,Math.floor(x0)),maxx=Math.min(N-1,Math.ceil(x0+w/s)),miny=Math.max(0,Math.floor(y0)),maxy=Math.min(N-1,Math.ceil(y0+h/s));for(let y=miny;y<=maxy;y++)for(let x=minx;x<=maxx;x++){let i=ix(x,y),sx=(x-x0)*s,sy=(y-y0)*s;ctx.fillStyle=terrain[i]?'#326d8c':((x+y)%3?'#35563a':'#3b6040');ctx.fillRect(sx,sy,s+.5,s+.5);if(roads[i]){ctx.fillStyle='#b5a27b';ctx.fillRect(sx+s*.2,sy+s*.2,s*.6,s*.6)}if(trees[i]){ctx.fillStyle='#163e2b';ctx.fillRect(sx+s*.18,sy+s*.12,s*.72,s*.76);ctx.fillStyle='#4c8150';ctx.fillRect(sx+s*.2,sy+s*.08,s*.55,s*.48)}if(berries[i]){ctx.fillStyle='#d47b78';ctx.fillRect(sx+s*.5,sy+s*.45,Math.max(1,s*.19),Math.max(1,s*.19))}if(stone[i]){ctx.fillStyle='#adb4a6';ctx.fillRect(sx+s*.24,sy+s*.4,s*.45,s*.4)}if(iron[i]){ctx.fillStyle='#a78567';ctx.fillRect(sx+s*.28,sy+s*.22,s*.42,s*.3)}}for(const b of buildings){if(b.x<minx-3||b.x>maxx+3||b.y<miny-3||b.y>maxy+3)continue;let x=(b.x-x0)*s,y=(b.y-y0)*s;ctx.fillStyle=b.type==='market'?'#f5cb70':b.type==='house'?'#d2a77b':b.type==='school'?'#b4d0b8':b.type==='watchtower'?'#a59e8c':b.type==='townhall'?'#c7c4ae':'#ac977e';ctx.fillRect(x-s*.8,y-s*.8,s*2.6,s*2.5);ctx.fillStyle=COLORS[b.village];ctx.fillRect(x-s*.8,y-s*.8,s*2.6,s*.5);if(s>6){ctx.fillStyle='#352e27';ctx.font=`${Math.max(8,s*.8)}px sans-serif`;ctx.fillText(({market:'M',house:'H',school:'S',townhall:'T',watchtower:'W'})[b.type]||'?',x,y+s*.8)}}for(const p of state.people){if(!p.alive||p.x<minx||p.x>maxx||p.y<miny||p.y>maxy)continue;let x=(p.x-x0)*s,y=(p.y-y0)*s;ctx.fillStyle=COLORS[p.village];ctx.fillRect(x+s*.18,y+s*.32,s*.63,s*.65);ctx.fillStyle='#efc99b';ctx.fillRect(x+s*.3,y+s*.12,s*.4,s*.33);if(selected===p.id){ctx.strokeStyle='#ffe873';ctx.lineWidth=2;ctx.strokeRect(x,y,s,s)}}for(const v of state.villages){const x=(v.x-x0)*s,y=(v.y-y0)*s;if(x>-80&&x<w+80&&y>-80&&y<h+80){ctx.fillStyle=COLORS[v.id];ctx.font=`bold ${Math.max(11,Math.min(17,s*1.3))}px sans-serif`;ctx.fillText(v.name,x-18,y-20)}}}
function render(){document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));document.getElementById('clock').textContent=`Year ${state.year} · Day ${state.day} · ${state.people.filter(p=>p.alive).length} residents · ${fmt(state.trades)} trades`;const el=document.getElementById('content'),card=(name,val)=>`<div class="stat"><small>${name}</small><strong>${val}</strong></div>`;if(tab==='economy'){el.innerHTML=`<h2>💰 Two independent economies</h2><div class="grid">${state.villages.map(v=>`<div class="panel"><h3 style="color:${COLORS[v.id]}">${v.name}</h3>${card('Treasury',fmt(v.gold)+' G')}${card('Residents',state.people.filter(p=>p.alive&&p.village===v.id).length)}${card('Property tax collected',fmt(v.taxes)+' G')}${card('Market profit',fmt(v.profits)+' G')}${card('Public wages',fmt(v.wages)+' G')}<button data-focus="${v.id}">View village</button></div>`).join('')}</div><div class="panel">All gold moves between citizens and their village treasury. Market resale markup: 25%. Property tax: 1 / 2 / 3 gold per day for level 1 / 2 / 3 homes. <br><br>Direct trades: ${state.barters} · Market transactions: ${state.trades} · Iron mined: ${state.ironMined}</div>`}else if(tab==='markets'){el.innerHTML='<h2>🏪 Village markets</h2>'+state.villages.map(v=>`<div class="panel"><h3 style="color:${COLORS[v.id]}">${v.name} · ${fmt(v.gold)} G treasury</h3><div class="event row"><b>Item / stock</b><b>Market buys / sells</b></div>${ITEMS.map(k=>`<div class="event row"><span>${esc(k)} · ${fmt(v.market.stock[k])}</span><span>${price(v,k)} G / ${Math.ceil(price(v,k)*1.25)} G</span></div>`).join('')}</div>`).join('')}else if(tab==='people'){const p=state.people.find(q=>q.id===selected)||state.people[0];el.innerHTML=`<h2>👥 Villagers</h2><select id="person" style="width:100%">${state.people.map(q=>`<option value="${q.id}" ${q.id===p.id?'selected':''}>${esc(q.name+' '+q.surname)} · ${q.village?'Red':'Blue'}</option>`).join('')}</select><div class="panel"><h3>${esc(p.name+' '+p.surname)} · ${esc(p.occupation)}</h3><div class="grid">${card('Gold',fmt(p.gold)+' G')}${card('Age',p.age)}${card('Food',p.food)}${card('Carrying',load(p)+' / '+capacity(p))}${card('Energy',Math.round(p.energy)+'%')}${card('Hunger',Math.round(p.hunger)+'%')}${card('Earned',fmt(p.earnings)+' G')}${card('Spent',fmt(p.spent)+' G')}</div><p>Goal: ${esc(p.goal)}</p><p>💭 ${esc(p.thought)}</p><p>Home: ${homeOf(p)?'Level '+homeOf(p).level:'None'} · Property taxes paid: ${p.taxPaid} G</p><button id="findPerson">Locate on map</button></div>`}else if(tab==='government'){el.innerHTML='<h2>🏛️ Government & paid jobs</h2>'+state.villages.map(v=>`<div class="panel"><h3 style="color:${COLORS[v.id]}">${v.name}</h3><p>Mayor: ${esc(state.people[v.mayor]?.name||'None')} · Term: Year ${v.term}</p><p>Treasury: ${fmt(v.gold)} G · Completed public works: ${v.completed}</p><h3>Public job board</h3>${v.jobs.slice(-15).reverse().map(j=>`<div class="event"><b>${esc(j.type)}</b> · ${j.wage} G · ${j.status}<br><small>${j.progress}/${j.required} work · ${j.worker===null?'Unclaimed':esc(state.people[j.worker]?.name||'Unknown')}</small></div>`).join('')||'<p>No jobs yet.</p>'}</div>`).join('')}else if(tab==='news'){el.innerHTML='<h2>📰 Village News</h2>'+state.news.slice(0,90).map(e=>`<div class="event"><span style="color:${e.vid===null?'#fff':COLORS[e.vid]}">●</span> ${esc(e.msg)}<br><small>Year ${e.year}, day ${e.day} · ${esc(e.kind)}</small></div>`).join('')}else{el.innerHTML=`<h2>🌍 World & controls</h2><div class="panel">Map: ${N} × ${N} = ${fmt(N*N)} tiles (6.02× the area of the original 128 × 128 map).<br><br>Two distant villages, independent treasuries, mayors, markets, prices and public jobs.<br><br>1 game day = 60 simulation ticks. 1 year = 120 days.<br><br>Gold is transferred, not minted, during trade, taxation and wages.<br><br>Version 3 uses a <b>separate save slot</b> from version 2, so your previous civilization is preserved in browser storage. Export backups regularly.</div>`}el.querySelectorAll('[data-focus]').forEach(b=>b.onclick=()=>{const v=village(+b.dataset.focus);cam.x=v.x;cam.y=v.y;draw()});const picker=el.querySelector('#person');if(picker)picker.onchange=()=>{selected=+picker.value;render()};const find=el.querySelector('#findPerson');if(find)find.onclick=()=>{const p=state.people.find(q=>q.id===selected)||state.people[0];cam.x=p.x;cam.y=p.y;draw()}}
function save(){try{localStorage.setItem(KEY,JSON.stringify({state,seed,terrain:Array.from(terrain),trees:Array.from(trees),berries:Array.from(berries),stone:Array.from(stone),iron:Array.from(iron),roads:Array.from(roads),buildings,cam}));return true}catch(e){console.error(e);return false}}
function restore(obj){if(!obj?.state||obj.terrain?.length!==N*N||!Array.isArray(obj.state.villages)||obj.state.villages.length!==2)throw Error('Not a valid AI Village 3 save');state=obj.state;seed=obj.seed;random=rng(seed+state.t);terrain=Uint8Array.from(obj.terrain);trees=Uint8Array.from(obj.trees);berries=Uint8Array.from(obj.berries);stone=Uint8Array.from(obj.stone);iron=Uint8Array.from(obj.iron);roads=Uint8Array.from(obj.roads);buildings=obj.buildings||[];cam=obj.cam||{x:73,y:88,scale:8};render()}
function loop(now){const dt=Math.min(.2,(now-last)/1000);last=now;if(!paused){acc+=dt*speed*30;let steps=0;while(acc>=1&&steps<45){tick();acc--;steps++}if(steps===45)acc=0}draw();uiElapsed+=dt;if(uiElapsed>.8){uiElapsed=0;render()}requestAnimationFrame(loop)}
function err(e){const el=document.getElementById('error');el.style.display='block';el.textContent='AI Village 3.0 error: '+(e?.stack||e?.message||String(e));paused=true}window.addEventListener('error',e=>err(e.error||e.message));window.addEventListener('unhandledrejection',e=>err(e.reason));
function screen(e){let r=canvas.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}let fingers=new Map();canvas.addEventListener('pointerdown',e=>{canvas.setPointerCapture(e.pointerId);fingers.set(e.pointerId,screen(e));drag={point:screen(e),camX:cam.x,camY:cam.y,moved:false}});canvas.addEventListener('pointermove',e=>{if(!fingers.has(e.pointerId))return;let q=screen(e),prev=fingers.get(e.pointerId);fingers.set(e.pointerId,q);if(fingers.size===2){let ps=[...fingers.values()];if(!drag.pinch){drag.pinch=Math.hypot(ps[0].x-ps[1].x,ps[0].y-ps[1].y);drag.scale=cam.scale}let d=Math.hypot(ps[0].x-ps[1].x,ps[0].y-ps[1].y);cam.scale=Math.max(2,Math.min(38,drag.scale*d/Math.max(1,drag.pinch)));drag.moved=true}else if(drag){cam.x-=(q.x-prev.x)/cam.scale;cam.y-=(q.y-prev.y)/cam.scale;drag.moved=drag.moved||Math.hypot(q.x-drag.point.x,q.y-drag.point.y)>6}});canvas.addEventListener('pointerup',e=>{const q=screen(e);fingers.delete(e.pointerId);if(drag&&!drag.moved&&fingers.size===0){let x=Math.round(cam.x+(q.x-vp.clientWidth/2)/cam.scale),y=Math.round(cam.y+(q.y-vp.clientHeight/2)/cam.scale);const p=state.people.find(p=>p.alive&&Math.abs(p.x-x)<=1&&Math.abs(p.y-y)<=1);if(p){selected=p.id;tab='people';render()}else{let v=state.villages.find(v=>Math.hypot(v.x-x,v.y-y)<4);if(v){tab='markets';render()}}}if(!fingers.size)drag=null});canvas.addEventListener('pointercancel',e=>{fingers.delete(e.pointerId);drag=null});canvas.addEventListener('wheel',e=>{e.preventDefault();cam.scale=Math.max(2,Math.min(38,cam.scale*(e.deltaY>0?.88:1.12)))},{passive:false});
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});document.getElementById('pause').onclick=()=>{paused=!paused;document.getElementById('pause').textContent=paused?'▶ Resume':'⏸ Pause'};document.getElementById('speed').onchange=e=>speed=+e.target.value;document.getElementById('save').onclick=()=>alert(save()?'World saved.':'Save failed. Export a backup.');document.getElementById('new').onclick=()=>{if(confirm('Create a new AI Village 3 world? Your current v3 world will be replaced. Export a backup first.'))start()};document.getElementById('export').onclick=()=>{const blob=new Blob([JSON.stringify({state,seed,terrain:Array.from(terrain),trees:Array.from(trees),berries:Array.from(berries),stone:Array.from(stone),iron:Array.from(iron),roads:Array.from(roads),buildings,cam})],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='ai-village-v3-year-'+state.year+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};document.getElementById('import').onclick=()=>document.getElementById('importFile').click();document.getElementById('importFile').onchange=async e=>{try{const f=e.target.files[0];if(!f)return;restore(JSON.parse(await f.text()));save();alert('World imported successfully.')}catch(e){alert('Import failed: '+e.message)}};
try{let raw=localStorage.getItem(KEY);if(raw)restore(JSON.parse(raw));else start()}catch(e){console.warn('Save could not load',e);start()}setInterval(()=>{if(state)save()},30000);document.addEventListener('visibilitychange',()=>{if(document.hidden&&state)save()});requestAnimationFrame(loop);
})();</script></body></html>
