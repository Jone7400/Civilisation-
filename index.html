<script>
(()=>{'use strict';
const surnames=['Ashwood','Riverbend','Oakheart','Stonefield','Willowmere','Northbrook','Fernholm','Brightwater','Thornhill','Meadowcroft','Redleaf','Ironwood'];
const fullName=p=>p.name+' '+(p.surname||surnames[p.id%12]);
const boyNames=['Theo','Felix','Elias','Milo','Hugo','Anton','Leo','August','Emil','Arthur','Finn','Otto'];
const girlNames=['Alma','Luna','Ella','Nora','Clara','Liv','Iris','Agnes','Vera','Asta','Saga','Maja'];
const N=128,DAY=120,SEASON=30, YEAR=120, names=['Anna','Erik','Mia','Oscar','Sofie','Lars','Emma','Noah','Freja','Oliver','Ida','Lucas'],colors=['#f2b97d','#c9a6f5','#f5d56d','#81d7ce','#ff999a','#b7d78b'],seed0=42517;
let state,selected=0,tab='people',god=false,paused=false,speed=1,last=performance.now(),acc=0,uiTimer=0,cam={x:64,y:64,scale:19},drag=null,dirty=false;
const canvas=document.getElementById('world'),ctx=canvas.getContext('2d'),vp=document.getElementById('viewport');
function rand(seed){let x=seed|0;return()=>{x^=x<<13;x^=x>>>17;x^=x<<5;return (x>>>0)/4294967296}}
let worldSeed=42517,r=rand(worldSeed);let stoneNodes=new Uint8Array(N*N),terrain=new Uint8Array(N*N),trees=new Uint8Array(N*N),berries=new Uint8Array(N*N),height=new Uint8Array(N*N),buildings=[];
function idx(x,y){return y*N+x}function inside(x,y){return x>=0&&y>=0&&x<N&&y<N}function cell(x,y){return inside(x,y)?terrain[idx(x,y)]:1}
function generate(){
 // Every NEW WORLD gets a different seed; loading an existing save preserves its exact terrain.
 const rr=rand(worldSeed^0x59f3),riverCount=1+Math.floor(rr()*3);
 terrain.fill(0);trees.fill(0);berries.fill(0);height.fill(0);
 for(let y=0;y<N;y++)for(let x=0;x<N;x++){
  const k=idx(x,y),wave=Math.sin(x*.071+worldSeed*.0003)+Math.cos(y*.09-worldSeed*.0002)+Math.sin((x+y)*.044);
  height[k]=Math.max(0,Math.min(8,Math.floor(4+wave+rr()*3)));
  const forestDensity=.25+.28*(.5+.5*Math.sin(x*.077+y*.043+worldSeed*.001));
  trees[k]=rr()<forestDensity?1:0;berries[k]=trees[k]&&rr()<.19?1:0;
 }
 // Meandering rivers; some flow vertically, some horizontally.
 for(let n=0;n<riverCount;n++){
  const vertical=rr()<.5,offset=19+rr()*90,phase=rr()*6.28,amp=5+rr()*10,width=1.4+rr()*1.3;
  for(let t=0;t<N;t++){const middle=offset+Math.sin(t*.058+phase)*amp+Math.sin(t*.12+phase*.7)*2.8;
   for(let v=Math.floor(middle-width-1);v<=Math.ceil(middle+width+1);v++){
    const x=vertical?v:t,y=vertical?t:v;
    if(inside(x,y)&&Math.abs(v-middle)<=width){terrain[idx(x,y)]=1;trees[idx(x,y)]=0;berries[idx(x,y)]=0}
   }
  }
 }
 // Irregular lakes, each a different size and shape.
 const lakes=2+Math.floor(rr()*5);
 for(let n=0;n<lakes;n++){const cx=9+rr()*110,cy=9+rr()*110,rx=3+rr()*8,ry=3+rr()*7,phase=rr()*6.28;
  for(let y=Math.max(0,Math.floor(cy-ry-3));y<Math.min(N,cy+ry+3);y++)for(let x=Math.max(0,Math.floor(cx-rx-3));x<Math.min(N,cx+rx+3);x++){
   const a=Math.atan2((y-cy)/ry,(x-cx)/rx),dist=Math.hypot((x-cx)/rx,(y-cy)/ry),edge=1+.14*Math.sin(a*5+phase)+.1*Math.cos(a*3-phase);
   if(dist<edge){const k=idx(x,y);terrain[k]=1;trees[k]=0;berries[k]=0}
  }
 }
 // Preserve the iconic circular grassy starting clearing, with nearby water reachable.
 for(let y=48;y<=78;y++)for(let x=43;x<=73;x++){
  const d=Math.hypot(x-58,y-63),k=idx(x,y);
  if(d<=10.5){terrain[k]=0;trees[k]=0;berries[k]=0}
  else if(d<13&&terrain[k]===1){terrain[k]=0;trees[k]=0;berries[k]=0}
 }
 // Guaranteed accessible shoreline outside the clearing: a small pond to the east.
 const cx=75,cy=63;for(let y=cy-4;y<=cy+4;y++)for(let x=cx-5;x<=cx+5;x++){
  if(!inside(x,y))continue;const d=Math.hypot((x-cx)/5,(y-cy)/4),k=idx(x,y);
  if(d<.83){terrain[k]=1;trees[k]=0;berries[k]=0}
  else if(d<1.15){terrain[k]=0;trees[k]=0;berries[k]=0}
 }
 // Foraging bushes near founders, so the initial days are survivable.
 for(let i=0;i<30;i++){const a=rr()*Math.PI*2,d=11+rr()*7,x=Math.round(58+Math.cos(a)*d),y=Math.round(63+Math.sin(a)*d);if(inside(x,y)&&!terrain[idx(x,y)]){trees[idx(x,y)]=1;berries[idx(x,y)]=1}}
}

function log(msg){state.events.unshift({day:state.day,year:state.year,msg});state.events.length=Math.min(90,state.events.length);dirty=true}
function makePerson(i){let a=i*Math.PI*2/12;return{id:i,name:names[i],surname:surnames[i%12],birthSurname:surnames[i%12],fatherId:null,motherId:null,partnerId:null,sex:i%2===0?'F':'M',birthYear:1,lastChildYear:-100,surnameChanges:0,x:58+Math.cos(a)*5,y:63+Math.sin(a)*5,age:18+Math.floor(r()*23),hunger:70+r()*25,thirst:70+r()*25,energy:70+r()*25,health:90+r()*10,food:1,wood:0,stone:0,skill:Math.floor(r()*20),trust:{},goal:'Explore',plan:'',memory:[],target:null,step:0,alive:true,traits:{curiosity:Math.round(r()*100),kindness:Math.round(r()*100),caution:Math.round(r()*100)},home:null}}
function generateStone(){stoneNodes=new Uint8Array(N*N);let rr=rand(worldSeed+991);for(let y=0;y<N;y++)for(let x=0;x<N;x++){let k=idx(x,y);if(terrain[k]===0&&!trees[k]&&(height[k]>=5||rr()<.08)&&rr()<.19)stoneNodes[k]=2+Math.floor(rr()*5)}}
function stoneAt(x,y){return inside(x,y)?stoneNodes[idx(x,y)]:0}
function ensureTransport(){if(!state.transport)state.transport={stoneTrips:0,stoneMined:0,woodTrips:0,foodTrips:0,failedRoutes:0}}
function physicalStone(p){ensureTransport();let spot=route(p,(x,y)=>stoneAt(x,y)>0,30);if(!spot){state.transport.failedRoutes++;return false}if(!(spot.arrived||walk(p,spot.target))){p.plan='Walking to a stone deposit';return true}let k=idx(spot.target.x,spot.target.y);if(!stoneNodes[k])return false;stoneNodes[k]--;p.stone++;state.production.stoneGathered++;state.transport.stoneMined++;state.transport.stoneTrips++;p.plan='Mined stone at a deposit';return true}
function init(){worldSeed=(Math.floor(Math.random()*2147483646)+1);r=rand(worldSeed);generate();generateStone();state={year:1,day:1,t:0,people:Array.from({length:12},(_,i)=>makePerson(i)),events:[],births:0,deaths:0,discoveries:[],totalFood:0,structures:0,history:[],weather:'Clear',civilizations:1,worldSeed:worldSeed};log('Twelve founders arrived in the wilderness.');log('A new civilization begins.')}
function remember(p,msg,weight=1){p.memory.unshift({day:state.day,year:state.year,msg,weight});if(p.memory.length>14)p.memory.pop()}
// Breadth-first navigation: choose reachable targets rather than geometrically nearest blocked tiles.
const dirs=[[1,0],[-1,0],[0,1],[0,-1]];
// Weighted Dijkstra navigation. Villagers gradually learn that established paths cost less effort.
// A small preference exists initially; personal walking experience strengthens it.
function pathWear(a,b){const c=state?.civilization;if(!c)return 0;const k=a<b?a+':'+b:b+':'+a;return (c.pathEdges?.[k]||0)}
function walkingCost(p,from,to){const wear=pathWear(from,to),experience=Math.min(1,(p.distanceWalked||0)/180);
 const familiarity=.20+.80*experience,discount=Math.min(.57,wear/42*.57)*familiarity;
 return 1-discount}
function route(p,condition,radius=22){
 const sx=Math.round(p.x),sy=Math.round(p.y),start=idx(sx,sy),dist=new Float32Array(N*N),prev=new Int32Array(N*N),done=new Uint8Array(N*N);
 dist.fill(Infinity);prev.fill(-1);dist[start]=0;
 const heap=[];function push(k,c){let i=heap.length;heap.push([k,c]);while(i>0){let j=(i-1)>>1;if(heap[j][1]<=c)break;heap[i]=heap[j];i=j}heap[i]=[k,c]}
 function pop(){const top=heap[0],last=heap.pop();if(heap.length){let i=0;while(true){let j=i*2+1;if(j>=heap.length)break;if(j+1<heap.length&&heap[j+1][1]<heap[j][1])j++;if(heap[j][1]>=last[1])break;heap[i]=heap[j];i=j}heap[i]=last}return top}
 push(start,0);
 while(heap.length){const [k,cost]=pop();if(done[k]||cost>dist[k]+.0001)continue;done[k]=1;const x=k%N,y=(k/N)|0;
  if(condition(x,y)){let step=k;while(prev[step]!==-1&&prev[step]!==start)step=prev[step];return{target:{x,y},next:step===start?null:{x:step%N,y:(step/N)|0},arrived:k===start}}
  for(const [dx,dy] of dirs){const nx=x+dx,ny=y+dy;if(!inside(nx,ny)||cell(nx,ny)===1||trees[idx(nx,ny)]||Math.abs(nx-sx)+Math.abs(ny-sy)>radius)continue;
   const nk=idx(nx,ny);if(done[nk])continue;const next=cost+walkingCost(p,k,nk);if(next<dist[nk]){dist[nk]=next;prev[nk]=k;push(nk,next)}}
 }return null}

// When a forest encloses a villager, remove an adjacent blocking tree rather than starving in place.
// If a route cannot be found, clear a tree that leads toward the actual objective.
// The earlier rescue only worked when ALL four adjacent tiles were blocked.
function clearBlockingTree(p,condition,radius=90){
 const sx=Math.round(p.x),sy=Math.round(p.y);
 const candidates=dirs.map(([dx,dy])=>({x:sx+dx,y:sy+dy})).filter(q=>inside(q.x,q.y)&&trees[idx(q.x,q.y)]&&cell(q.x,q.y)!==1);
 if(!candidates.length)return false;
 // Prefer trees bordering open ground and lying near a reachable objective.
 const targets=[];
 const scan=Math.min(N-1,Math.max(24,radius));
 for(let y=Math.max(0,sy-scan);y<=Math.min(N-1,sy+scan);y++)for(let x=Math.max(0,sx-scan);x<=Math.min(N-1,sx+scan);x++){
  if(Math.abs(x-sx)+Math.abs(y-sy)>scan||cell(x,y)===1)continue;
  if(condition(x,y))targets.push({x,y,d:Math.abs(x-sx)+Math.abs(y-sy)});
 }
 targets.sort((a,b)=>a.d-b.d);
 const goal=targets[0];
 const openAround=q=>dirs.reduce((n,[dx,dy])=>n+(inside(q.x+dx,q.y+dy)&&cell(q.x+dx,q.y+dy)!==1&&!trees[idx(q.x+dx,q.y+dy)]?1:0),0);
 candidates.sort((a,b)=>{
  const sa=openAround(a)*1.7-(goal?Math.abs(a.x-goal.x)+Math.abs(a.y-goal.y):0);
  const sb=openAround(b)*1.7-(goal?Math.abs(b.x-goal.x)+Math.abs(b.y-goal.y):0);
  return sb-sa;
 });
 const q=candidates[0],k=idx(q.x,q.y);trees[k]=0;berries[k]=0;
 const env=ensureEnvironment();env.felled++;env.stumps[k]=state.t;
 p.wood=(p.wood||0)+1;p.energy=Math.max(0,p.energy-.1);
 p.plan='Clearing forest to reach destination';p.blockedTreesCleared=(p.blockedTreesCleared||0)+1;
 state.navigationRescues=(state.navigationRescues||0)+1;
 if(p.blockedTreesCleared===1||p.blockedTreesCleared%8===0)remember(p,'Cleared a tree blocking a route',3);
 dirty=true;return true;
}
function walkTo(p,condition,radius){
 let path=route(p,condition,radius);
 if(!path){
  p.navigationFailures=(p.navigationFailures||0)+1;
  // Only chop after repeated failures. This also works when some adjacent ground is free.
  p.routeFailStreak=(p.routeFailStreak||0)+1;
  if(p.routeFailStreak>=2){if(clearBlockingTree(p,condition,Math.max(radius,65)))p.routeFailStreak=0}
  p.plan='Searching for a route ('+p.routeFailStreak+' failures)';return false;
 }
 p.routeFailStreak=0;
 if(path.arrived)return true;
 if(!path.next)return false;
 const ox=p.x,oy=p.y;p.x=path.next.x;p.y=path.next.y;
 if(p.x!==ox||p.y!==oy){if(typeof markFootpath==='function')markFootpath(p.x,p.y,ox,oy);
  const from=idx(ox,oy),to=idx(p.x,p.y),cost=walkingCost(p,from,to);
  p.energy=Math.max(0,p.energy-(.035*cost));
  if(!state.pathStats)state.pathStats={steps:0,energySaved:0,trailSteps:0};
  state.pathStats.steps++;state.pathStats.energySaved+=.035*(1-cost);
  if(pathWear(from,to)>=10)state.pathStats.trailSteps++;
  dirty=true;p.distanceWalked=(p.distanceWalked||0)+1;state.distanceWalked=(state.distanceWalked||0)+1;p.lastMovedTick=state.t;
 }
 return false;
}
function walk(p,target){if(!target)return false;return walkTo(p,(x,y)=>x===target.x&&y===target.y,Math.max(24,Math.min(120,Math.abs(target.x-p.x)+Math.abs(target.y-p.y)+8)))}

function person(id){return state.people.find(p=>p.id===id)}
function related(a,b){if(!a||!b)return true;if(a.id===b.id)return true;let parents=p=>[p.fatherId,p.motherId].filter(v=>v!==null&&v!==undefined);let aa=parents(a),bb=parents(b);return aa.includes(b.id)||bb.includes(a.id)||aa.some(id=>bb.includes(id))}
const skillNames=['Foraging','Woodcraft','Building','Exploration','Care'];
function ensureLearning(p){if(!p.skills||typeof p.skills!=='object'){let base=Number(p.skill)||0;p.skills={Foraging:base*.4,Woodcraft:base*.25,Building:base*.15,Exploration:base*.2,Care:0}}if(!skillNames.includes(p.interest)){let weights=[p.traits?.curiosity||50,p.traits?.caution||50,p.traits?.kindness||50];p.interest=skillNames[(p.id+Math.floor(weights[0]/20))%skillNames.length]}if(!p.mentors)p.mentors={};if(!p.learningLog)p.learningLog=[]}
function learn(p,skill,amount,source){ensureLearning(p);p.skills[skill]=Math.min(100,(p.skills[skill]||0)+amount*(p.interest===skill?1.5:1));p.skill=Object.values(p.skills).reduce((a,b)=>a+b,0)/5;if(source&&r()<.018){p.learningLog.unshift({year:state.year,day:state.day,skill,source});p.learningLog.length=Math.min(12,p.learningLog.length)}}
function teachChild(p,mentor){ensureLearning(p);ensureLearning(mentor);const choices=skillNames.filter(k=>(mentor.skills[k]||0)>(p.skills[k]||0)+1);if(!choices.length)return;choices.sort((a,b)=>((mentor.skills[b]||0)-(p.skills[b]||0))+(b===p.interest?6:0)-((mentor.skills[a]||0)-(p.skills[a]||0))-(a===p.interest?6:0));let skill=choices[0],gain=Math.min(.085,((mentor.skills[skill]||0)-(p.skills[skill]||0))*.003);learn(p,skill,gain,'Observed '+fullName(mentor));p.mentors[mentor.id]=(p.mentors[mentor.id]||0)+1;p.plan='Learning '+skill.toLowerCase()+' from '+fullName(mentor);if(r()<.003){remember(p,'Learned '+skill.toLowerCase()+' from '+fullName(mentor),4);remember(mentor,'Taught '+skill.toLowerCase()+' to '+fullName(p),3)}}
function familyAncestors(p,depth=0,seen=new Set()){if(!p||depth>7||seen.has(p.id))return null;seen.add(p.id);return{id:p.id,name:fullName(p),age:p.age,alive:p.alive,father:p.fatherId!=null?familyAncestors(person(p.fatherId),depth+1,new Set(seen)):null,mother:p.motherId!=null?familyAncestors(person(p.motherId),depth+1,new Set(seen)):null}}
function familyHome(p){if(!p)return null;const mate=p.partnerId!=null?person(p.partnerId):null;if(mate&&mate.alive&&(p.home||mate.home))return p.home||mate.home;const parent=p.motherId!=null?person(p.motherId):null;const father=p.fatherId!=null?person(p.fatherId):null;return p.home||(parent&&parent.home)||(father&&father.home)||null}
function birthDiagnostics(){const women=state.people.filter(p=>p.alive&&p.sex==='F'&&p.age>=18&&p.age<=43);let paired=0,near=0,healthy=0,ready=0;for(const mother of women){if(mother.partnerId==null)continue;const father=person(mother.partnerId);if(!father||!father.alive||father.sex!=='M'||father.age>65)continue;paired++;if(Math.hypot(mother.x-father.x,mother.y-father.y)>8)continue;near++;if(mother.health<30||father.health<30||mother.hunger<24||mother.thirst<24)continue;healthy++;if(mother.lastChildYear>state.year-2||father.lastChildYear>state.year-2)continue;ready++}return {women:women.length,paired,near,healthy,ready}}
function familyDay(){
 const adults=state.people.filter(p=>p.alive&&p.age>=18&&p.age<=55);
 for(const p of adults){if(p.partnerId!=null)continue;
  if(r()>.085)continue;
  const matches=adults.filter(q=>q.id!==p.id&&q.partnerId==null&&q.sex!==p.sex&&!related(p,q)&&Math.hypot(q.x-p.x,q.y-p.y)<32);
  if(!matches.length)continue;
  matches.sort((a,b)=>Math.hypot(a.x-p.x,a.y-p.y)-Math.hypot(b.x-p.x,b.y-p.y));
  const q=matches[Math.floor(r()*Math.min(matches.length,3))];
  if(r()>.32+(p.traits.kindness+q.traits.kindness)/500)continue;
  p.partnerId=q.id;q.partnerId=p.id;if(p.home&&!q.home)q.home={...p.home};else if(q.home&&!p.home)p.home={...q.home};

  const pr=relationship(p,q),qr=relationship(q,p);

function pointer(e){let rect=canvas.getBoundingClientRect();return{x:e.clientX-rect.left,y:e.clientY-rect.top}}
let pointers=new Map(),pinch=null;
canvas.addEventListener('pointerdown',e=>{canvas.setPointerCapture(e.pointerId);pointers.set(e.pointerId,pointer(e));if(pointers.size===1){drag={start:pointer(e),camx:cam.x,camy:cam.y,moved:false}}else if(pointers.size===2){let [a,b]=[...pointers.values()];pinch={dist:Math.hypot(a.x-b.x,a.y-b.y),scale:cam.scale};drag=null}});
canvas.addEventListener('pointermove',e=>{if(!pointers.has(e.pointerId))return;pointers.set(e.pointerId,pointer(e));if(pointers.size===2&&pinch){let [a,b]=[...pointers.values()];cam.scale=Math.max(6,Math.min(48,pinch.scale*Math.hypot(a.x-b.x,a.y-b.y)/Math.max(1,pinch.dist)))}else if(drag&&pointers.size===1){let q=pointer(e),dx=q.x-drag.start.x,dy=q.y-drag.start.y;if(Math.abs(dx)+Math.abs(dy)>7)drag.moved=true;cam.x=Math.max(0,Math.min(N,drag.camx-dx/cam.scale));cam.y=Math.max(0,Math.min(N,drag.camy-dy/cam.scale))}});
canvas.addEventListener('pointerup',e=>{let q=pointer(e);if(drag&&!drag.moved){let wx=cam.x+(q.x-vp.clientWidth/2)/cam.scale,wy=cam.y+(q.y-vp.clientHeight/2)/cam.scale;let nearest=state.people.filter(p=>p.alive).sort((a,b)=>Math.hypot(a.x-wx,a.y-wy)-Math.hypot(b.x-wx,b.y-wy))[0];if(nearest&&Math.hypot(nearest.x-wx,nearest.y-wy)<1.8)selectPerson(nearest.id)}pointers.delete(e.pointerId);if(pointers.size<2)pinch=null;drag=null});
canvas.addEventListener('pointercancel',e=>{pointers.delete(e.pointerId);drag=null;pinch=null});
canvas.addEventListener('wheel',e=>{e.preventDefault();cam.scale=Math.max(6,Math.min(48,cam.scale*(e.deltaY>0?.9:1.1)))},{passive:false});

const APP_VERSION='1.5.0';
function versionParts(v){return String(v).replace(/^v/,'').split('.').map(x=>parseInt(x,10)||0)}
function newerVersion(a,b){const aa=versionParts(a),bb=versionParts(b);for(let i=0;i<3;i++){if((aa[i]||0)!==(bb[i]||0))return (aa[i]||0)>(bb[i]||0)}return false}
async function checkForUpdate(manual=false){if(!/^https?:$/.test(location.protocol)){if(manual)alert('Update checks require GitHub Pages.');return}const b=document.getElementById('checkUpdates');if(manual&&b){b.disabled=true;b.textContent='🔄 Checking…'}try{const res=await fetch('./version.json?check='+Date.now(),{cache:'no-store'});if(!res.ok)throw new Error('version.json unavailable');const info=await res.json();if(!info||typeof info.version!=='string')throw new Error('Invalid version.json');if(!newerVersion(info.version,APP_VERSION)){if(manual)alert('You are up to date: v'+APP_VERSION);return}const notice=document.getElementById('updateNotice');document.getElementById('updateMessage').textContent='AI Village v'+info.version+' is available. '+(info.notes||'Save and refresh to update.');notice.style.display='block';document.getElementById('updateNow').onclick=()=>{if(!save()){document.getElementById('updateStatus').textContent='Save failed; update cancelled.';return}location.reload()};document.getElementById('updateLater').onclick=()=>{notice.style.display='none'}}catch(e){if(manual)alert('Update check failed: '+e.message)}finally{if(b){b.disabled=false;b.textContent='🔄 Check updates'}}}
