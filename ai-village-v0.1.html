<style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#edf4e9;background:#111b16}*{box-sizing:border-box}body{margin:0}header{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:10px 14px;background:#1c2b21;border-bottom:1px solid #39503d;flex-wrap:wrap}h1{font-size:18px;margin:0}small,.muted{color:#a8bea9}button,select{background:#314d37;color:white;border:1px solid #608467;border-radius:9px;padding:9px 12px;font:inherit;cursor:pointer}button:hover{background:#41694a}button.active{background:#7e6333;border-color:#c69b4e}main{display:grid;grid-template-columns:minmax(0,1fr) 330px;min-height:calc(100dvh - 65px)}#viewport{position:relative;min-height:440px;overflow:hidden;background:#243a29;touch-action:none}canvas{width:100%;height:100%;display:block;image-rendering:pixelated;touch-action:none}#hint{position:absolute;bottom:12px;left:12px;background:#15241cbb;padding:7px 10px;border-radius:8px;font-size:12px;pointer-events:none}aside{background:#1a2820;border-left:1px solid #38523d;max-height:calc(100dvh - 65px);overflow:auto;padding:14px}.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}.tabs button{padding:7px 10px;font-size:13px}h2{font-size:17px;margin:8px 0 12px}h3{font-size:14px;margin:16px 0 6px;color:#b5d8b6}.panel{background:#23362a;border:1px solid #3c5b44;border-radius:12px;padding:12px;margin-bottom:10px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.stat{background:#263e2e;border-radius:8px;padding:10px}.stat strong{display:block;font-size:20px;margin-top:3px}.bar{height:7px;background:#102016;border-radius:5px;overflow:hidden;margin:5px 0 9px}.bar span{display:block;height:100%;background:#9dcf7e}.row{display:flex;justify-content:space-between;gap:8px;align-items:center}.event{padding:8px 0;border-bottom:1px solid #354a39;font-size:13px}.event:last-child{border:0}.pill{background:#395a41;border-radius:50px;padding:3px 7px;font-size:11px}.buttons{display:flex;gap:7px;flex-wrap:wrap}.notice{font-size:12px;line-height:1.5;color:#b9cdb9}.hidden{display:none!important}@media(max-width:850px){main{display:block}#viewport{height:55dvh;min-height:300px}aside{border-left:0;border-top:1px solid #38523d;max-height:none}header{padding:9px}h1{font-size:16px}#hint{font-size:10px}}</style></head>
<body><header><div><h1>🌿 AI Village <small>v0.1 · First Dawn</small></h1><small id="clock">Year 1 · Day 1</small></div><div class="buttons"><button id="pause">⏸ Pause</button><select id="speed" aria-label="Simulation speed"><option value="1">1× speed</option><option value="3">3× speed</option><option value="10">10× speed</option></select><button id="save">💾 Save</button><button id="god">⚡ God Mode</button></div></header>
<main><div id="viewport"><canvas id="world"></canvas><div id="hint">Drag to pan · Pinch / scroll to zoom · Tap a villager to inspect</div></div><aside><div class="tabs"><button data-tab="people" class="active">Villagers</button><button data-tab="stats">Statistics</button><button data-tab="history">History</button><button data-tab="world">World</button></div><div id="content"></div></aside></main>
<script>
(()=>{'use strict';
const N=128,DAY=120,SEASON=30, YEAR=120, names=['Anna','Erik','Mia','Oscar','Sofie','Lars','Emma','Noah','Freja','Oliver','Ida','Lucas'],colors=['#f2b97d','#c9a6f5','#f5d56d','#81d7ce','#ff999a','#b7d78b'],seed0=42517;
let state,selected=0,tab='people',god=false,paused=false,speed=1,last=performance.now(),acc=0,uiTimer=0,cam={x:64,y:64,scale:19},drag=null,dirty=false;
const canvas=document.getElementById('world'),ctx=canvas.getContext('2d'),vp=document.getElementById('viewport');
function rand(seed){let x=seed|0;return()=>{x^=x<<13;x^=x>>>17;x^=x<<5;return (x>>>0)/4294967296}}
const r=rand(seed0);let terrain=new Uint8Array(N*N),trees=new Uint8Array(N*N),berries=new Uint8Array(N*N),height=new Uint8Array(N*N),buildings=[];
function idx(x,y){return y*N+x}function inside(x,y){return x>=0&&y>=0&&x<N&&y<N}function cell(x,y){return inside(x,y)?terrain[idx(x,y)]:1}
function generate(){for(let y=0;y<N;y++)for(let x=0;x<N;x++){let k=idx(x,y),d=Math.hypot((x-58)/20,(y-63)/16),water=Math.sin(x*.13)+Math.cos(y*.16)+Math.sin((x+y)*.07);terrain[k]=water>2.18?1:0;height[k]=Math.max(0,Math.min(8,Math.floor(4+water*1.5+r()*2)));trees[k]=terrain[k]===0&&r()<(.42+.18*Math.sin(x*.08+y*.05))?1:0;berries[k]=trees[k]&&r()<.16?1:0}for(let y=55;y<71;y++)for(let x=49;x<67;x++){let k=idx(x,y);terrain[k]=0;trees[k]=0;berries[k]=0}for(let y=0;y<N;y++)for(let x=0;x<N;x++){let k=idx(x,y);if(Math.abs(y-37-11*Math.sin(x*.065))<2.2)terrain[k]=1}}
function log(msg){state.events.unshift({day:state.day,year:state.year,msg});state.events.length=Math.min(90,state.events.length);dirty=true}
function makePerson(i){let a=i*Math.PI*2/12;return{id:i,name:names[i],x:58+Math.cos(a)*5,y:63+Math.sin(a)*5,age:18+Math.floor(r()*23),hunger:70+r()*25,thirst:70+r()*25,energy:70+r()*25,health:90+r()*10,food:1,wood:0,stone:0,skill:Math.floor(r()*20),trust:{},goal:'Explore',plan:'',memory:[],target:null,step:0,alive:true,traits:{curiosity:Math.round(r()*100),kindness:Math.round(r()*100),caution:Math.round(r()*100)},home:null}}
function init(){generate();state={year:1,day:1,t:0,people:Array.from({length:12},(_,i)=>makePerson(i)),events:[],births:0,deaths:0,discoveries:[],totalFood:0,structures:0,history:[],weather:'Clear',civilizations:1,worldSeed:seed0};log('Twelve founders arrived in the wilderness.');log('A new civilization begins.')}
function remember(p,msg,weight=1){p.memory.unshift({day:state.day,year:state.year,msg,weight});if(p.memory.length>14)p.memory.pop()}
function nearest(p,condition,radius=14){let best=null,dist=Infinity;for(let y=Math.max(0,Math.floor(p.y-radius));y<=Math.min(N-1,Math.floor(p.y+radius));y++)for(let x=Math.max(0,Math.floor(p.x-radius));x<=Math.min(N-1,Math.floor(p.x+radius));x++){if(!condition(x,y))continue;let d=Math.abs(p.x-x)+Math.abs(p.y-y);if(d<dist){dist=d;best={x,y}}}return best}
function walk(p,target){if(!target)return false;let dx=target.x-p.x,dy=target.y-p.y;if(Math.hypot(dx,dy)<1.1)return true;let options=[{x:p.x+Math.sign(dx),y:p.y},{x:p.x,y:p.y+Math.sign(dy)}].sort((a,b)=>Math.hypot(a.x-target.x,a.y-target.y)-Math.hypot(b.x-target.x,b.y-target.y));for(let q of options){let x=Math.round(q.x),y=Math.round(q.y);if(inside(x,y)&&cell(x,y)!==1){p.x=x;p.y=y;return false}}return false}
function act(p){if(!p.alive)return;
p.hunger=Math.max(0,p.hunger-.11);p.thirst=Math.max(0,p.thirst-.18);p.energy=Math.max(0,p.energy-.055);
if(p.hunger<8||p.thirst<8)p.health-=.16;
if(p.health<=0){p.alive=false;state.deaths++;log(`${p.name} died from deprivation at age ${p.age}.`);return}
let options=[{goal:'Drink',score:(100-p.thirst)*1.55},{goal:'Eat',score:(100-p.hunger)*1.3+(p.food>0?10:0)},{goal:'Rest',score:(100-p.energy)*1.15},{goal:'Gather food',score:32+(p.food<2?35:0)},{goal:'Collect wood',score:27+(p.wood<3?12:0)},{goal:'Build shelter',score:p.wood>=4&&p.home===null?65:3},{goal:'Explore',score:24+p.traits.curiosity*.15}];
let choice=options.sort((a,b)=>b.score-a.score)[0];p.goal=choice.goal;p.plan='';
if(choice.goal==='Drink'){let water=nearest(p,(x,y)=>cell(x,y)===0&&[[-1,0],[1,0],[0,-1],[0,1]].some(([dx,dy])=>cell(x+dx,y+dy)===1),22);if(water&&walk(p,water)){p.thirst=Math.min(100,p.thirst+38);p.plan='Drinking at nearby water';if(r()<.0015){p.health-=8;remember(p,'Felt ill after drinking untreated water')}}else p.plan='Searching for water'}
else if(choice.goal==='Eat'){if(p.food>0){p.food--;p.hunger=Math.min(100,p.hunger+44);p.plan='Eating stored food'}else{p.goal='Gather food'}}
else if(choice.goal==='Rest'){p.energy=Math.min(100,p.energy+1.8);p.plan='Recovering energy'}
else if(choice.goal==='Gather food'){let spot=nearest(p,(x,y)=>berries[idx(x,y)]>0,20);if(spot&&walk(p,spot)){berries[idx(spot.x,spot.y)]=0;p.food++;state.totalFood++;p.skill+=.03;remember(p,'Found edible berries');p.plan='Collected berries'}else p.plan='Looking for edible plants'}
else if(choice.goal==='Collect wood'){let spot=nearest(p,(x,y)=>trees[idx(x,y)]>0,14);if(spot&&walk(p,spot)){trees[idx(spot.x,spot.y)]=0;p.wood++;p.skill+=.03;p.plan='Gathered timber'}else p.plan='Searching for timber'}
else if(choice.goal==='Build shelter'){let x=Math.round(p.x),y=Math.round(p.y);if(cell(x,y)===0){p.wood-=4;p.home={x,y};buildings.push({x,y,owner:p.id});state.structures++;log(`${p.name} built a wooden shelter.`);remember(p,'Built my first shelter',5)}}
else{let a=r()*Math.PI*2;let dest={x:Math.max(0,Math.min(127,Math.round(p.x+Math.cos(a)*5))),y:Math.max(0,Math.min(127,Math.round(p.y+Math.sin(a)*5)))};walk(p,dest);p.plan='Exploring the surroundings'}
if(r()<.004){let other=state.people.filter(q=>q.alive&&q!==p&&Math.hypot(q.x-p.x,q.y-p.y)<3);if(other.length){let q=other[Math.floor(r()*other.length)];if(p.food>2&&q.hunger<40&&p.traits.kindness>50){p.food--;q.food++;p.trust[q.id]=(p.trust[q.id]||0)+2;q.trust[p.id]=(q.trust[p.id]||0)+5;remember(p,`Shared food with ${q.name}`,2);remember(q,`${p.name} shared food with me`,3);log(`${p.name} shared food with ${q.name}.`)}else{p.trust[q.id]=(p.trust[q.id]||0)+.2}}}}
function tick(){state.t++;for(let p of state.people)act(p);if(state.t%60===0){state.day++;if(state.day>YEAR){state.day=1;state.year++;state.history.push({year:state.year-1,pop:state.people.filter(p=>p.alive).length,buildings:state.structures});state.history=state.history.slice(-40);for(let p of state.people){if(p.alive){p.age++;if(p.age>62&&r()<(p.age-61)*.014){p.alive=false;state.deaths++;log(`${p.name} died of old age, aged ${p.age}.`)}}}log(`Year ${state.year} begins.`)}if(state.day%10===0){for(let i=0;i<350;i++){let x=Math.floor(r()*N),y=Math.floor(r()*N),k=idx(x,y);if(terrain[k]===0&&!trees[k]&&r()<.45)trees[k]=1;if(trees[k]&&!berries[k]&&r()<.4)berries[k]=1}}if(state.day%30===1){state.weather=['Clear','Rain','Windy','Cold'][Math.floor(r()*4)]}for(let p of state.people){p.memory=p.memory.filter(m=>m.weight>=3||state.year-m.year<2||r()<.35)}}
if(state.people.every(p=>!p.alive)){paused=true;log('The first civilization has fallen. The world remains.');document.getElementById('pause').textContent='▶ Resume';}
dirty=true}
function draw(){let dpr=Math.min(devicePixelRatio||1,2),w=vp.clientWidth,h=vp.clientHeight;if(canvas.width!==Math.round(w*dpr)||canvas.height!==Math.round(h*dpr)){canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr)}ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,w,h);ctx.imageSmoothingEnabled=false;let s=cam.scale,x0=cam.x-w/(2*s),y0=cam.y-h/(2*s);let minx=Math.max(0,Math.floor(x0)),maxx=Math.min(N-1,Math.ceil(x0+w/s)),miny=Math.max(0,Math.floor(y0)),maxy=Math.min(N-1,Math.ceil(y0+h/s));
for(let y=miny;y<=maxy;y++)for(let x=minx;x<=maxx;x++){let k=idx(x,y),px=Math.floor((x-x0)*s),py=Math.floor((y-y0)*s),size=Math.ceil(s+1);ctx.fillStyle=terrain[k]===1?'#3b86a1':height[k]>6?'#7a886e':(x+y)%3===0?'#688f51':'#739c59';ctx.fillRect(px,py,size,size);if(terrain[k]===1){ctx.fillStyle='#7bb9c4';ctx.fillRect(px+2,py+3,Math.max(2,s*.35),Math.max(1,s*.08))}else if(trees[k]){ctx.fillStyle='#344e2f';ctx.fillRect(px+s*.42,py+s*.52,s*.2,s*.4);ctx.fillStyle='#315d39';ctx.fillRect(px+s*.12,py+s*.08,s*.75,s*.65);ctx.fillStyle='#49834a';ctx.fillRect(px+s*.18,py+s*.09,s*.45,s*.3)}else if(berries[k]){ctx.fillStyle='#b44d59';ctx.fillRect(px+s*.35,py+s*.4,Math.max(2,s*.2),Math.max(2,s*.2))}}
for(let b of buildings){let px=(b.x-x0)*s,py=(b.y-y0)*s;ctx.fillStyle='#a17c52';ctx.fillRect(px,py,s,s);ctx.fillStyle='#75472d';ctx.fillRect(px-s*.15,py-s*.18,s*1.3,s*.42);ctx.fillStyle='#d6b579';ctx.fillRect(px+s*.35,py+s*.6,s*.25,s*.4)}
for(let p of state.people){if(!p.alive)continue;let px=(p.x-x0+.5)*s,py=(p.y-y0+.5)*s;if(px<-20||px>w+20||py<-20||py>h+20)continue;ctx.fillStyle='#14291b';ctx.fillRect(px-s*.24,py-s*.05,s*.48,s*.42);ctx.fillStyle=colors[p.id%colors.length];ctx.fillRect(px-s*.21,py-s*.32,s*.42,s*.35);ctx.fillStyle='#e8cf9c';ctx.fillRect(px-s*.16,py-s*.45,s*.32,s*.18);if(selected===p.id){ctx.strokeStyle='#ffdb74';ctx.lineWidth=2;ctx.strokeRect(px-s*.34,py-s*.56,s*.68,s*1.05)}if(s>=13){ctx.font='bold 10px system-ui';ctx.textAlign='center';ctx.fillStyle='#fff';ctx.strokeStyle='#203126';ctx.lineWidth=3;ctx.strokeText(p.name,px,py-s*.64);ctx.fillText(p.name,px,py-s*.64)}}}
function selectPerson(id){selected=id;tab='people';render()}
function render(){document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));document.getElementById('clock').textContent=`Year ${state.year} · Day ${state.day} · ${['Spring','Summer','Autumn','Winter'][Math.floor((state.day-1)/SEASON)]} · ${state.weather}`;let el=document.getElementById('content'),alive=state.people.filter(p=>p.alive),p=state.people.find(p=>p.id===selected)||state.people[0];let bar=(label,v)=>`<div class="row"><small>${label}</small><small>${Math.max(0,Math.round(v))}%</small></div><div class="bar"><span style="width:${Math.max(0,Math.min(100,v))}%"></span></div>`;let esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
if(tab==='people'){el.innerHTML=`<h2>👥 Villager Inspector</h2><div class="panel"><label for="person">Select villager</label><select id="person" style="width:100%;margin:8px 0">${state.people.map(q=>`<option value="${q.id}" ${q.id===p.id?'selected':''}>${esc(q.name)} · ${q.alive?'Alive':'Deceased'}</option>`).join('')}</select><div class="row"><strong>${esc(p.name)} · Age ${p.age}</strong><span class="pill">${p.alive?'Alive':'Deceased'}</span></div><p class="muted" style="font-size:13px">Current goal: <b>${esc(p.goal)}</b><br>${esc(p.plan||'Evaluating options')}</p>${bar('Hunger / fullness',p.hunger)}${bar('Hydration',p.thirst)}${bar('Energy',p.energy)}${bar('Health',p.health)}<div class="grid"><div class="stat"><small>Food</small><strong>${p.food}</strong></div><div class="stat"><small>Wood</small><strong>${p.wood}</strong></div></div><h3>Personality</h3><small>Curiosity ${p.traits.curiosity} · Kindness ${p.traits.kindness} · Caution ${p.traits.caution}</small><h3>Recent memories</h3>${p.memory.slice(0,5).map(m=>`<div class="event">${esc(m.msg)}<br><small>Year ${m.year}, day ${m.day}</small></div>`).join('')||'<small>No memories recorded yet.</small>'}</div><div class="panel"><h3>Founders</h3><div class="buttons">${state.people.map(q=>`<button data-person="${q.id}" style="opacity:${q.alive?1:.45}">${esc(q.name)}</button>`).join('')}</div></div>`;el.querySelector('#person').onchange=e=>selectPerson(+e.target.value);el.querySelectorAll('[data-person]').forEach(b=>b.onclick=()=>selectPerson(+b.dataset.person))}
else if(tab==='stats'){el.innerHTML=`<h2>📊 Civilization Statistics</h2><div class="grid">${[['Living villagers',alive.length],['Year',state.year],['Shelters',state.structures],['Food gathered',state.totalFood],['Deaths',state.deaths],['Civilizations',state.civilizations]].map(([a,b])=>`<div class="stat"><small>${a}</small><strong>${b}</strong></div>`).join('')}</div><div class="panel"><h3>Population by age</h3>${[['Under 18',alive.filter(p=>p.age<18).length],['18–39',alive.filter(p=>p.age>=18&&p.age<40).length],['40–59',alive.filter(p=>p.age>=40&&p.age<60).length],['60+',alive.filter(p=>p.age>=60).length]].map(([a,b])=>`<div class="row"><small>${a}</small><b>${b}</b></div>`).join('')}<h3>Population history</h3>${state.history.length?state.history.map(v=>`<div class="row"><small>Year ${v.year}</small><span>${v.pop} villagers · ${v.buildings} shelters</span></div>`).join(''):'<small>Annual records will appear at the end of year 1.</small>'}</div>`}
else if(tab==='history'){el.innerHTML=`<h2>📜 World History</h2><div class="panel">${state.events.map(e=>`<div class="event">${esc(e.msg)}<br><small>Year ${e.year}, day ${e.day}</small></div>`).join('')}</div>`}
else{el.innerHTML=`<h2>🌍 World & Controls</h2><div class="panel"><p>128 × 128 tile wilderness · procedurally generated starter map</p><p>One game day takes 2 real minutes at 1×. One year is 120 days.</p><p class="notice">Prototype features: autonomous needs, foraging, water seeking, timber gathering, shelter building, basic social sharing, selective memories, yearly aging, seasons, local saves and observation tools.</p><p class="notice">Not implemented yet: births, advanced discoveries, true multi-step planning, diseases, currency, culture, terrain engineering, world expansion, detailed offline replay or new civilization spawning.</p></div>${god?`<div class="panel"><h3>⚡ God Mode</h3><div class="buttons"><button id="giveFood">Give everyone food</button><button id="heal">Heal everyone</button><button id="forest">Regrow nearby forest</button><button id="nextDay">Advance one day</button><button id="newCivilization">Start new civilization</button></div></div>`:'<div class="panel">Enable God Mode in the top bar for world interventions.</div>'}<div class="panel"><h3>Save data</h3><div class="buttons"><button id="export">Export save</button><button id="reset">Reset world</button></div><p class="notice">Automatic local save every 30 seconds. Your browser may delete local data; export for backup.</p></div>`;if(god){el.querySelector('#giveFood').onclick=()=>{alive.forEach(p=>p.food+=5);log('God Mode: food granted.');render()};el.querySelector('#heal').onclick=()=>{alive.forEach(p=>p.health=100);log('God Mode: villagers healed.');render()};el.querySelector('#forest').onclick=()=>{for(let y=48;y<80;y++)for(let x=42;x<80;x++){let k=idx(x,y);if(!terrain[k]&&r()<.5)trees[k]=1}log('God Mode: forest regrown.');render()};el.querySelector('#nextDay').onclick=()=>{for(let i=0;i<60;i++)tick();render()};el.querySelector('#newCivilization').onclick=()=>{if(alive.length&&!confirm('Start a new civilization? This will replace the current villagers.'))return;state.civilizations++;state.people=Array.from({length:12},(_,i)=>makePerson(i));selected=0;paused=false;log('A new group of founders arrived among the remnants.');render()}}el.querySelector('#export').onclick=()=>{let blob=new Blob([JSON.stringify(serialize())],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='ai-village-save.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};el.querySelector('#reset').onclick=()=>{if(confirm('Delete the current simulation and start over?')){localStorage.removeItem('aiVillageV01');buildings=[];init();render()}}}}
function serialize(){return{state,terrain:Array.from(terrain),trees:Array.from(trees),berries:Array.from(berries),height:Array.from(height),buildings,cam}}
function save(){try{localStorage.setItem('aiVillageV01',JSON.stringify(serialize()));return true}catch(e){alert('Save failed. Browser storage may be full.');return false}}
function load(){try{let s=JSON.parse(localStorage.getItem('aiVillageV01'));if(!s||!s.state||s.terrain.length!==N*N)return false;state=s.state;terrain=Uint8Array.from(s.terrain);trees=Uint8Array.from(s.trees);berries=Uint8Array.from(s.berries);height=Uint8Array.from(s.height);buildings=s.buildings||[];cam=s.cam||cam;return true}catch(e){return false}}
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});document.getElementById('pause').onclick=()=>{paused=!paused;document.getElementById('pause').textContent=paused?'▶ Resume':'⏸ Pause'};document.getElementById('speed').onchange=e=>speed=+e.target.value;document.getElementById('save').onclick=()=>{if(save())alert('Saved on this device.')};document.getElementById('god').onclick=e=>{god=!god;e.target.classList.toggle('active',god);tab='world';render()};
function pointer(e){let rect=canvas.getBoundingClientRect();return{x:e.clientX-rect.left,y:e.clientY-rect.top}}
let pointers=new Map(),pinch=null;
canvas.addEventListener('pointerdown',e=>{canvas.setPointerCapture(e.pointerId);pointers.set(e.pointerId,pointer(e));if(pointers.size===1){drag={start:pointer(e),camx:cam.x,camy:cam.y,moved:false}}else if(pointers.size===2){let [a,b]=[...pointers.values()];pinch={dist:Math.hypot(a.x-b.x,a.y-b.y),scale:cam.scale};drag=null}});
canvas.addEventListener('pointermove',e=>{if(!pointers.has(e.pointerId))return;pointers.set(e.pointerId,pointer(e));if(pointers.size===2&&pinch){let [a,b]=[...pointers.values()];cam.scale=Math.max(6,Math.min(48,pinch.scale*Math.hypot(a.x-b.x,a.y-b.y)/Math.max(1,pinch.dist)))}else if(drag&&pointers.size===1){let q=pointer(e),dx=q.x-drag.start.x,dy=q.y-drag.start.y;if(Math.abs(dx)+Math.abs(dy)>7)drag.moved=true;cam.x=Math.max(0,Math.min(N,drag.camx-dx/cam.scale));cam.y=Math.max(0,Math.min(N,drag.camy-dy/cam.scale))}});
canvas.addEventListener('pointerup',e=>{let q=pointer(e);if(drag&&!drag.moved){let wx=cam.x+(q.x-vp.clientWidth/2)/cam.scale,wy=cam.y+(q.y-vp.clientHeight/2)/cam.scale;let nearest=state.people.filter(p=>p.alive).sort((a,b)=>Math.hypot(a.x-wx,a.y-wy)-Math.hypot(b.x-wx,b.y-wy))[0];if(nearest&&Math.hypot(nearest.x-wx,nearest.y-wy)<1.8)selectPerson(nearest.id)}pointers.delete(e.pointerId);if(pointers.size<2)pinch=null;drag=null});
canvas.addEventListener('pointercancel',e=>{pointers.delete(e.pointerId);drag=null;pinch=null});
canvas.addEventListener('wheel',e=>{e.preventDefault();cam.scale=Math.max(6,Math.min(48,cam.scale*(e.deltaY>0?.9:1.1)))},{passive:false});
if(!load())init();render();setInterval(()=>save(),30000);document.addEventListener('visibilitychange',()=>{if(document.hidden)save()});
function loop(now){let dt=Math.min(.15,(now-last)/1000);last=now;if(!paused){acc+=dt*speed;while(acc>=2&&acc<100){tick();acc-=2}}draw();uiTimer+=dt;if(uiTimer>.6){uiTimer=0;if(dirty){render();dirty=false}}requestAnimationFrame(loop)}requestAnimationFrame(loop);
})();
</script></body></html>
